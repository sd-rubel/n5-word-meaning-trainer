<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Japanese Vocabulary – Gallery Slide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --card-w: clamp(380px, 42vw, 560px);
      --card-h: clamp(380px, 60vh, 600px);
      --radius: 28px;
      --blur: 20px;
      --shadow: 0 18px 48px rgba(0,0,0,.45);
      --accent: #ffd54f;
      --accent-soft: #ffe082;
      --text-light: #e8f1ff;
      --text-bn: #9be7a1;
      --glass: rgba(255,255,255,.10);
      --glass-border: rgba(255,255,255,.28);
      --fx: cubic-bezier(.4,0,.2,1);
      --anim-dur: 600ms;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      font-family: 'Noto Sans',"Hind Siliguri",sans-serif;
      color: white;
      background:
        url('https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/background-img.jpg')
        no-repeat center/cover;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    body::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(120deg, rgba(4,8,20,.70), rgba(4,8,20,.50));
      z-index: 0;
    }

    body::after {
      content:'';
      position: absolute; inset: -20%;
      background:
        radial-gradient(60rem 40rem at 12% 18%, rgba(255,193,7,.28), transparent 55%),
        radial-gradient(48rem 48rem at 88% 78%, rgba(41,182,246,.24), transparent 60%),
        radial-gradient(42rem 30rem at 60% 30%, rgba(129,199,132,.20), transparent 60%),
        conic-gradient(from 210deg at 50% 50%, rgba(255,255,255,.05), transparent 30%, rgba(255,255,255,.06), transparent 70%, rgba(255,255,255,.05));
      filter: blur(36px);
      mix-blend-mode: screen;
      animation: floaty 12s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes floaty {
      0%   { transform: translateY(0) translateX(0) scale(1); opacity: .95; }
      100% { transform: translateY(-2%) translateX(1%) scale(1.03); opacity: 1; }
    }

    .app-frame {
      position: relative;
      width: min(96vw, 1480px);
      height: min(78vh, 680px);
      display: grid;
      z-index: 1;
    }

    .carousel {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      perspective: 1200px;
      overflow: hidden;
    }

    .card {
      position: absolute;
      width: var(--card-w);
      height: var(--card-h);
      padding: clamp(18px, 2.8vw, 32px);
      border-radius: var(--radius);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--blur));
      box-shadow: var(--shadow);
      transition: transform var(--anim-dur) var(--fx), opacity var(--anim-dur) var(--fx);
      opacity: 0;
    }

    .card.active {
      opacity: 1;
      z-index: 2;
      transform: translateX(0) scale(1);
    }

    .card.next {
      opacity: 0.8;
      z-index: 1;
      transform: translateX(calc(var(--card-w) + 60px)) scale(0.9);
    }

    .card.prev {
      opacity: 0.8;
      z-index: 1;
      transform: translateX(calc(-1 * (var(--card-w) + 60px))) scale(0.9);
    }

    .card-content {
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto auto auto 1fr;
      align-items: center;
      justify-items: center;
      gap: 12px;
      text-align: center;
    }

    .jp-word {
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 4px 14px rgba(0,0,0,.38);
      font-size: clamp(2.1rem, 4.6vw, 3.8rem);
    }

    .pronunciation {
      font-style: italic;
      font-size: 1.3rem;
      color: #cfe8ff;
    }

    .bengali-meaning {
      font-family: "Hind Siliguri", sans-serif;
      color: var(--text-bn);
      font-weight: 700;
      font-size: 1.8rem;
    }

    .comment {
      font-family: "Hind Siliguri", sans-serif;
      color: var(--text-light);
      opacity: .94;
      font-size: 1rem;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      max-width: 92%;
    }

    @media (max-width: 720px) {
      :root { --card-w: min(94vw, 560px); --card-h: min(80vh, 600px); }
    }

    /* New styles for character highlighting */
    .char-wrapper {
      position: relative;
      display: inline-block;
      transition: transform 300ms var(--fx), color 300ms var(--fx);
    }

    .char-wrapper.highlight {
      transform: scale(1.3);
      color: var(--accent-soft);
      text-shadow: 0 0 12px rgba(255, 213, 79, 0.8);
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <main class="carousel" id="carousel"></main>
  </div>
  <script>
    const JSON_URL = 'https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/lesson-1.json';
    const root = document.getElementById('carousel');

    let vocab = [];
    let current = 0;
    let charIndex = -1; // Tracks current character or group

    const synth = window.speechSynthesis;
    let voices = [];

    function loadVoices() {
      voices = synth.getVoices();
    }
    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speak(text, lang = 'ja-JP') {
      if (!synth || !text) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      const voice = voices.find(v => v.lang.startsWith(lang));
      if (voice) utter.voice = voice;
      synth.cancel();
      synth.speak(utter);
    }

    function speakCurrentJpWord() {
      if (vocab.length === 0) return;
      const jpWord = vocab[current].jp ?? vocab[current].japanese;
      speak(jpWord, 'ja-JP');
    }

    // Updated: Split Japanese word into pronunciation groups, ensuring ん is grouped with previous character
    function getCharGroups(word) {
      const groups = [];
      let i = 0;
      while (i < word.length) {
        let group = word[i];
        // Handle small kana (ゃ, ゅ, ょ, っ) or ん
        if (i + 1 < word.length && ['ゃ', 'ゅ', 'ょ', 'っ', 'ん'].includes(word[i + 1])) {
          group += word[i + 1];
          i += 2;
          // Check for ん following small kana (e.g., ちゃん)
          if (i < word.length && word[i] === 'ん') {
            group += word[i];
            i++;
          }
        } else if (i + 1 < word.length && word[i + 1] === 'ん') {
          // ん following a regular kana
          group += word[i + 1];
          i += 2;
        } else {
          i++;
        }
        groups.push(group);
      }
      return groups;
    }

    function makeCard(idx) {
      const w = vocab[idx];
      const jp = w.jp ?? w.japanese ?? '';
      const prnc = w.prnc ?? w.pronunciation ?? '';
      const bn = w.bn ?? w.meaning ?? '';
      const cmt = w.cmt ?? w.comment ?? '';

      // Split Japanese word into character groups
      const charGroups = getCharGroups(jp);
      const jpHtml = charGroups
        .map((group, i) => `<span class="char-wrapper" data-char-index="${i}">${group}</span>`)
        .join('');

      const el = document.createElement('div');
      el.className = 'card';
      el.setAttribute('data-index', idx);
      el.innerHTML = `
        <div class="card-content">
          <div></div>
          <h1 class="jp-word">${jpHtml}</h1>
          <p class="pronunciation">${prnc}</p>
          <p class="bengali-meaning">${bn}</p>
          <p class="comment">${cmt}</p>
          <div></div>
        </div>
      `;
      return el;
    }

    function showCard(index) {
      const cards = root.querySelectorAll('.card');
      cards.forEach(c => c.className = 'card');

      const active = root.querySelector(`[data-index="${index}"]`);
      if (active) active.classList.add('active');

      const prevIndex = (index - 1 + vocab.length) % vocab.length;
      const nextIndex = (index + 1) % vocab.length;

      const prev = root.querySelector(`[data-index="${prevIndex}"]`);
      const next = root.querySelector(`[data-index="${nextIndex}"]`);
      if (prev) prev.classList.add('prev');
      if (next) next.classList.add('next');

      current = index;
      charIndex = -1; // Reset character index
      resetCharHighlights(); // Reset highlights when card changes
    }

    // New: Reset character highlights
    function resetCharHighlights() {
      const activeCard = root.querySelector('.card.active');
      if (activeCard) {
        const chars = activeCard.querySelectorAll('.char-wrapper');
        chars.forEach(char => char.classList.remove('highlight'));
      }
    }

    // New: Highlight and pronounce character group
    function highlightChar() {
      const activeCard = root.querySelector('.card.active');
      if (!activeCard) return;

      const chars = activeCard.querySelectorAll('.char-wrapper');
      if (chars.length === 0) return;

      resetCharHighlights();

      charIndex = (charIndex + 1) % (chars.length + 1);
      if (charIndex === chars.length) {
        return; // No highlight after last character
      }

      const currentChar = chars[charIndex];
      currentChar.classList.add('highlight');
      const textToSpeak = currentChar.textContent.trim();
      speak(textToSpeak, 'ja-JP');
    }

    function slideNext() {
      const nextIndex = (current + 1) % vocab.length;
      showCard(nextIndex);
    }

    function slidePrev() {
      const prevIndex = (current - 1 + vocab.length) % vocab.length;
      showCard(prevIndex);
    }

    async function loadData() {
      try {
        const res = await fetch(JSON_URL);
        const data = await res.json();
        vocab = data;
        initCarousel();
      } catch (e) {
        root.innerHTML = `<div style="color:#ff8a80;">লোড ব্যর্থ</div>`;
      }
    }

    function initCarousel() {
      root.innerHTML = '';
      for (let i = 0; i < vocab.length; i++) {
        const card = makeCard(i);
        root.append(card);
      }
      if (vocab.length > 0) {
        showCard(0);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        slideNext();
      } else if (e.key === 'ArrowLeft') {
        slidePrev();
      } else if (e.key === ' ') {
        e.preventDefault();
        speakCurrentJpWord();
      } else if (e.key === 'p') {
        e.preventDefault();
        highlightChar();
      }
    });

    loadData();
  </script>
</body>
</html>
