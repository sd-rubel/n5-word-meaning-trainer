<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Japanese Vocabulary – Gallery Slide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    /* ============== RESET ============== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root{
      --card-w: clamp(380px, 42vw, 560px);
      --card-h: clamp(380px, 60vh, 600px);
      --radius: 28px;
      --blur: 20px;
      --shadow: 0 18px 48px rgba(0,0,0,.45);
      --accent: #ffd54f;
      --accent-soft: #ffe082;
      --text-light: #e8f1ff;
      --text-bn: #9be7a1;
      --glass: rgba(255,255,255,.10);
      --glass-border: rgba(255,255,255,.28);
      --fx: cubic-bezier(.4,0,.2,1);
      --anim-dur: 800ms;
    }

    @media (prefers-reduced-motion: reduce) {
      :root{ --anim-dur: 120ms; }
    }

    /* ============== STAGE ============== */
    body{
      min-height: 100svh;
      display: grid;
      place-items: center;
      font-family: 'Noto Sans', system-ui, -apple-system, Segoe UI, Roboto, "Hind Siliguri", sans-serif;
      color: white;
      background:
        url('https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/background-img.jpg')
        no-repeat center/cover;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    /* Dark veil */
    body::before{
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(120deg, rgba(4,8,20,.70), rgba(4,8,20,.50));
      z-index: 0;
    }

    /* UI Gradient Overlay (animated, soft) */
    body::after{
      content:'';
      position: absolute; inset: -20%;
      background:
        radial-gradient(60rem 40rem at 12% 18%, rgba(255,193,7,.28), transparent 55%),
        radial-gradient(48rem 48rem at 88% 78%, rgba(41,182,246,.24), transparent 60%),
        radial-gradient(42rem 30rem at 60% 30%, rgba(129,199,132,.20), transparent 60%),
        conic-gradient(from 210deg at 50% 50%, rgba(255,255,255,.05), transparent 30%, rgba(255,255,255,.06), transparent 70%, rgba(255,255,255,.05));
      filter: blur(36px);
      mix-blend-mode: screen;
      animation: floaty 12s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }
    @keyframes floaty {
      0%   { transform: translateY(0) translateX(0) scale(1); opacity: .95; }
      100% { transform: translateY(-2%) translateX(1%) scale(1.03); opacity: 1; }
    }

    /* ============== WRAPPER ============== */
    .app-frame{
      position: relative;
      width: min(96vw, 1480px);
      height: min(78vh, 680px);
      display: grid;
      grid-template-rows: 1fr;
      z-index: 1;
    }

    /* ============== CAROUSEL ============== */
    .carousel{
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      perspective: 1200px;
      overflow: hidden;
    }

    .card{
      position: absolute;
      width: var(--card-w);
      height: var(--card-h);
      padding: clamp(18px, 2.8vw, 32px);
      border-radius: var(--radius);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--blur));
      box-shadow: var(--shadow);
      transition: transform var(--anim-dur) var(--fx), opacity var(--anim-dur) var(--fx);
      z-index: 0;
      opacity: 0;
    }

    .card.active{
        opacity: 1;
        z-index: 1;
        transform: translateX(0) scale(1);
    }

    .card.next {
        opacity: 1;
        z-index: 0;
        transform: translateX(calc(var(--card-w) + 80px));
    }
    
    .card.prev {
        opacity: 1;
        z-index: 0;
        transform: translateX(calc(-1 * (var(--card-w) + 80px)));
    }

    /* Animations for sliding in/out */
    @keyframes slide-in-right {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
    
    @keyframes slide-out-left {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(-100%); opacity: 0; }
    }

    /* ============== CONTENT ============== */
    .card-content{
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto auto auto 1fr;
      align-items: center;
      justify-items: center;
      gap: clamp(6px, 1.2vw, 12px);
      text-align: center;
    }

    .jp-word{
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: .3px;
      color: var(--accent);
      text-shadow: 0 4px 14px rgba(0,0,0,.38);
      font-size: clamp(2.1rem, 4.6vw, 3.8rem);
      white-space: nowrap;
      max-width: 100%;
    }

    .pronunciation{
      font-style: italic;
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      color: #cfe8ff;
      opacity: .95;
    }

    .bengali-meaning{
      font-family: "Hind Siliguri", sans-serif;
      color: var(--text-bn);
      font-weight: 700;
      font-size: clamp(1.35rem, 2.8vw, 2rem);
      text-shadow: 0 2px 8px rgba(0,0,0,.28);
    }

    .comment{
      font-family: "Hind Siliguri", sans-serif;
      color: var(--text-light);
      opacity: .94;
      font-size: clamp(.95rem, 1.8vw, 1.12rem);
      line-height: 1.7;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      max-width: 92%;
    }
    
    /* Responsive tweaks */
    @media (max-width: 1100px){
      .card.left, .card.right{ opacity: 0; }
    }
    @media (max-width: 720px){
      :root{ --card-w: min(94vw, 560px); --card-h: min(80vh, 600px); }
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <main class="carousel" id="carousel"></main>
  </div>

  <script>
    /* ================== DATA & SETUP ================== */
    const JSON_URL = 'https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/lesson-1.json';
    const root = document.getElementById('carousel');

    let vocab = [];
    let current = 0;
    
    // Use Web Speech API for pronunciation
    const synth = window.speechSynthesis;

    async function loadData(retries = 3){
      try{
        const res = await fetch(JSON_URL, {cache: 'no-store'});
        if(!res.ok) throw new Error('Failed to load JSON');
        const data = await res.json();
        if(!Array.isArray(data) || !data.length) throw new Error('No vocabulary found');
        vocab = data;
        initCarousel();
      }catch(e){
        if(retries > 0){
          await new Promise(r => setTimeout(r, 1500));
          return loadData(retries - 1);
        }
        root.innerHTML = `<div style="padding:20px;border-radius:14px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.25);">
          <div style="font-family:'Hind Siliguri',sans-serif;font-size:1.1rem;color:#ff8a80;">ত্রুটি:</div>
          <div style="margin-top:6px;color:#fff;">${e.message}</div>
        </div>`;
      }
    }

    /* ================== SPEECH LOGIC ================== */
    function speak(text, lang = 'ja-JP') {
      if (!synth || !text) return;
      
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      
      const availableVoices = synth.getVoices();
      const voice = availableVoices.find(v => v.lang.startsWith(lang));
      if (voice) {
        utter.voice = voice;
      }
      
      synth.cancel(); // Stop any ongoing speech
      synth.speak(utter);
    }
    
    function speakCurrentJpWord() {
        if(vocab.length === 0) return;
        const jpWord = vocab[current].jp ?? vocab[current].japanese;
        speak(jpWord, 'ja-JP');
    }

    /* ================== CAROUSEL LOGIC ================== */
    function makeCard(){
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `
            <div class="card-content">
                <div class="spacer"></div>
                <h1 class="jp-word"></h1>
                <p class="pronunciation"></p>
                <p class="bengali-meaning"></p>
                <p class="comment"></p>
                <div class="spacer"></div>
            </div>
        `;
        return el;
    }

    function fillCard(card, idx){
        const w = vocab[idx];
        const jp   = w.jp ?? w.japanese ?? '';
        const prnc = w.prnc ?? w.pronunciation ?? '';
        const bn   = w.bn ?? w.meaning ?? '';
        const cmt  = w.cmt ?? w.comment ?? '';

        card.querySelector('.jp-word').textContent = jp;
        card.querySelector('.pronunciation').textContent = prnc;
        card.querySelector('.bengali-meaning').textContent = bn;
        card.querySelector('.comment').textContent = cmt;
    }

    function showCard(index, direction) {
        if (index < 0 || index >= vocab.length) return;

        const oldCard = document.querySelector('.card.active');
        const nextCard = root.querySelector(`[data-index="${index}"]`);
        
        if (oldCard && nextCard) {
            oldCard.classList.remove('active');
            nextCard.classList.remove('prev', 'next');
            nextCard.classList.add('active');
        }
        current = index;

        // Preload next/prev cards to the side
        const nextIndex = (current + 1) % vocab.length;
        const prevIndex = (current - 1 + vocab.length) % vocab.length;

        const nextCardToLoad = root.querySelector(`[data-index="${nextIndex}"]`);
        const prevCardToLoad = root.querySelector(`[data-index="${prevIndex}"]`);

        if(nextCardToLoad) {
            nextCardToLoad.classList.remove('active', 'prev', 'hidden');
            nextCardToLoad.classList.add('next');
        }
        if(prevCardToLoad) {
            prevCardToLoad.classList.remove('active', 'next', 'hidden');
            prevCardToLoad.classList.add('prev');
        }
    }

    function slideNext() {
        const nextIndex = (current + 1) % vocab.length;
        showCard(nextIndex, 'right');
    }
    
    function slidePrev() {
        const prevIndex = (current - 1 + vocab.length) % vocab.length;
        showCard(prevIndex, 'left');
    }

    function initCarousel(){
        root.innerHTML = '';
        for (let i = 0; i < vocab.length; i++) {
            const card = makeCard();
            card.setAttribute('data-index', i);
            fillCard(card, i);
            root.append(card);
        }

        if(vocab.length > 0) {
            showCard(0, 'right');
        }
    }

    /* ================== KEYBOARD CONTROLS ================== */
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') {
            slideNext();
        } else if (e.key === 'ArrowLeft') {
            slidePrev();
        } else if (e.key === ' ') {
            e.preventDefault(); // Prevents the page from scrolling
            speakCurrentJpWord();
        }
    });

    // Kickoff
    loadData();
  </script>
</body>
</html>
