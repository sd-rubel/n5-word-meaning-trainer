<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japanese Vocabulary – Gallery Slide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --card-w: clamp(380px, 42vw, 560px);
      --card-h: clamp(420px, 65vh, 650px);
      --radius: 28px;
      --blur: 20px;
      --shadow: 0 18px 48px rgba(0, 0, 0, .45);
      --accent: #ffd54f;
      --accent-soft: #fff9c4;
      --text-light: #e8f1ff;
      --text-bn: #9be7a1;
      --glass: rgba(255, 255, 255, .10);
      --glass-border: rgba(255, 255, 255, .28);
      --fx: cubic-bezier(.4, 0, .2, 1);
      --anim-dur: 600ms;
      --progress-bg: rgba(255, 255, 255, 0.1);
      --progress-fill: #00ff88;
    }
    body {
      min-height: 100svh; display: grid; place-items: center;
      font-family: 'Noto Sans', "Hind Siliguri", sans-serif;
      color: white;
      background: url('https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/background-img.jpg') no-repeat center/cover;
      position: relative; overflow: hidden; user-select: none;
    }
    body::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(120deg, rgba(4, 8, 20, .70), rgba(4, 8, 20, .50)); z-index: 0;
    }
    body::after {
      content: ''; position: absolute; inset: -20%;
      background: radial-gradient(60rem 40rem at 12% 18%, rgba(255, 193, 7, .28), transparent 55%),
                  radial-gradient(48rem 48rem at 88% 78%, rgba(41, 182, 246, .24), transparent 60%),
                  radial-gradient(42rem 30rem at 60% 30%, rgba(129, 199, 132, .20), transparent 60%),
                  conic-gradient(from 210deg at 50% 50%, rgba(255, 255, 255, .05), transparent 30%, rgba(255, 255, 255, .06), transparent 70%, rgba(255, 255, 255, .05));
      filter: blur(36px); mix-blend-mode: screen;
      animation: floaty 12s ease-in-out infinite alternate;
      z-index: 0; pointer-events: none;
    }
    @keyframes floaty { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-2%) scale(1.03); } }
    .app-frame { position: relative; width: min(96vw, 1480px); height: min(78vh, 680px); display: grid; z-index: 1; }
    .carousel { position: relative; width: 100%; height: 100%; display: grid; place-items: center; perspective: 1200px; overflow: hidden; }
    .card {
      position: absolute; width: var(--card-w); height: var(--card-h);
      padding: clamp(18px, 2.8vw, 32px); border-radius: var(--radius);
      background: var(--glass); border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--blur)); box-shadow: var(--shadow);
      transition: transform var(--anim-dur) var(--fx), opacity var(--anim-dur) var(--fx);
      opacity: 0; display: flex; flex-direction: column;
    }
    .card.active { opacity: 1; z-index: 2; transform: translateX(0) scale(1); }
    .card.next { opacity: 0.8; z-index: 1; transform: translateX(calc(var(--card-w) + 60px)) scale(0.9); }
    .card.prev { opacity: 0.8; z-index: 1; transform: translateX(calc(-1 * (var(--card-w) + 60px))) scale(0.9); }
    .card-header { display: flex; justify-content: space-between; width: 100%; font-size: 0.9rem; color: var(--text-light); margin-bottom: 0.5rem; opacity: 0.8; }
    .card-header span { background: rgba(255, 255, 255, .08); padding: 6px 10px; border-radius: 8px; }
    .card-header .highlight-text { color: #00ff88; font-weight: 700; }
    .card-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; text-align: center; }
    .card-emoji { font-size: clamp(2rem, 5vw, 4rem); margin-top: -1.5rem; }
    .jp-word { font-weight: 800; color: var(--accent); font-size: clamp(1.4rem, 3.2vw, 2.4rem); }
    .pronunciation { font-style: italic; font-size: 1.2rem; color: #cfe8ff; }
    .bengali-meaning { font-family: "Hind Siliguri", sans-serif; color: var(--text-bn); font-weight: 700; font-size: 1.6rem; }
    .comment { font-family: "Hind Siliguri", sans-serif; color: var(--text-light); font-size: 0.9rem; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .08); max-width: 92%; }
    .stats-panel {
      position: absolute; bottom: 20px; left: 20px;
      display: flex; flex-wrap: wrap; gap: 20px; z-index: 2;
      font-family: "Hind Siliguri", sans-serif; color: var(--text-light);
    }
    .stats-item { display: flex; flex-direction: column; font-size: 0.9rem; }
    .stats-item h3 { font-size: 1rem; color: var(--accent); margin-bottom: 4px; }
    .progress-container { background: var(--progress-bg); border-radius: 8px; height: 6px; width: 100px; margin-top: 4px; }
    .progress-bar { background: var(--progress-fill); height: 100%; transition: width 400ms var(--fx); box-shadow: 0 0 8px rgba(0, 255, 136, 0.6); }
    .social-links { position: absolute; bottom: 20px; right: 20px; z-index: 2; }
    .social-link {
      display: flex; align-items: center;
      background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(var(--blur));
      border-radius: 8px; padding: 8px 12px; color: var(--text-light);
      text-decoration: none; font-size: 0.9rem;
      opacity: 0; transform: translateX(100%);
      position: absolute; bottom: 0; right: 0;
      transition: transform 600ms var(--fx), opacity 600ms var(--fx);
    }
    .social-link.active { opacity: 1; transform: translateX(0); }
    .social-link i { margin-right: 8px; font-size: 1.2rem; }
    .social-link.facebook i { color: #1877F2; }
    .social-link.youtube i { color: #FF0000; }
    .social-link.tiktok i { color: #000000; }
    .social-link.telegram i { color: #0088cc; }
  </style>
</head>
<body>
  <div class="app-frame">
    <main class="carousel" id="carousel"></main>
    <div class="stats-panel" id="stats-panel"></div>
    <div class="social-links" id="social-links">
      <a href="https://facebook.com/sdxrubel" class="social-link facebook" target="_blank">
        <i class="fab fa-facebook-f"></i> facebook.com/sdxrubel
      </a>
      <a href="https://facebook.com/NihonGoBDAcademy" class="social-link facebook" target="_blank">
        <i class="fab fa-facebook-f"></i> facebook.com/NihonGoBDAcademy
      </a>
      <a href="https://youtube.com/@sdnrubel" class="social-link youtube" target="_blank">
        <i class="fab fa-youtube"></i> youtube.com/@sdnrubel
      </a>
      <a href="https://www.tiktok.com/@nihongo_bd_academy" class="social-link tiktok" target="_blank">
        <i class="fab fa-tiktok"></i> tiktok.com/@nihongo_bd_academy
      </a>
      <a href="https://t.me/NihonGoBD" class="social-link telegram" target="_blank">
        <i class="fab fa-telegram-plane"></i> t.me/NihonGoBD
      </a>
    </div>
  </div>
  <script>
    const JSON_URL = 'https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/lesson-1.json';
    const root = document.getElementById('carousel');
    const statsPanel = document.getElementById('stats-panel');
    let vocab = [], current = 0;
    let stats = {};

    async function loadData() {
      try {
        const res = await fetch(JSON_URL);
        vocab = await res.json();
        initStats();
        initCarousel();
        startSocialAnimation();
      } catch { root.innerHTML = `<div style="color:#ff8a80;">লোড ব্যর্থ</div>`; }
    }
    function initStats() {
      stats = {};
      vocab.forEach(w => { if (w.type) { if (!stats[w.type]) stats[w.type] = { total: 0, viewed: new Set() }; stats[w.type].total++; } });
      renderStats();
    }
    function renderStats() {
      statsPanel.innerHTML = '';
      for (const [type, obj] of Object.entries(stats)) {
        const div = document.createElement('div');
        div.className = 'stats-item';
        div.innerHTML = `<h3>${type}</h3>
          <span>${type}: <span id="${type}-count">${obj.total}</span></span>
          <div class="progress-container"><div class="progress-bar" id="${type}-progress" style="width: 0%"></div></div>`;
        statsPanel.append(div);
      }
    }
    function updateStats() {
      vocab.forEach((word, idx) => {
        if (word.type && stats[word.type]) {
          if (idx <= current) stats[word.type].viewed.add(idx);
        }
      });
      for (const [type, obj] of Object.entries(stats)) {
        document.getElementById(`${type}-count`).textContent = obj.total;
        document.getElementById(`${type}-progress`).style.width = obj.total ? `${(obj.viewed.size/obj.total)*100}%` : '0%';
      }
    }
    function makeCard(idx) {
      const w = vocab[idx];
      const jp = w.jp ?? ''; const prnc = w.prnc ?? ''; const bn = w.bn ?? ''; const cmt = w.cmt ?? '';
      const no = w['Phrase No'] ?? ''; const type = w.type ?? ''; const emoji = w.emoji ?? '';
      const el = document.createElement('div'); el.className = 'card'; el.dataset.index = idx;
      el.innerHTML = `
        <div class="card-header"><span>No: <b>${no}</b></span><span>Type: <b>${type}</b></span></div>
        <div class="card-content">
          <span class="card-emoji">${emoji}</span>
          <h1 class="jp-word">${jp}</h1>
          <p class="pronunciation">${prnc}</p>
          <p class="bengali-meaning">${bn}</p>
          <p class="comment">${cmt}</p>
        </div>`;
      return el;
    }
    function initCarousel() { root.innerHTML = ''; vocab.forEach((_,i)=>root.append(makeCard(i))); if (vocab.length>0) showCard(0); }
    function showCard(i) {
      const cards=root.querySelectorAll('.card'); cards.forEach(c=>c.className='card');
      const a=root.querySelector(`[data-index="${i}"]`); if (a) a.classList.add('active');
      const p=root.querySelector(`[data-index="${(i-1+vocab.length)%vocab.length}"]`); if(p) p.classList.add('prev');
      const n=root.querySelector(`[data-index="${(i+1)%vocab.length}"]`); if(n) n.classList.add('next');
      current=i; updateStats();
    }
    document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight')showCard((current+1)%vocab.length); if(e.key==='ArrowLeft')showCard((current-1+vocab.length)%vocab.length); });
    function startSocialAnimation() {
      const links=document.querySelectorAll('.social-link'); let index=0;
      function showNext(){
        links.forEach(l=>l.classList.remove('active'));
        links[index].classList.add('active');
        setTimeout(()=>{links[index].classList.remove('active'); index=(index+1)%links.length; showNext();},10000);
      }
      showNext();
    }
    loadData();
  </script>
</body>
</html>
