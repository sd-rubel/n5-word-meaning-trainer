<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Vocabulary Carousel</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0e7ff, #a3bffa);
            font-family: 'Noto Sans', sans-serif;
            overflow: hidden;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 450px;
            display: flex;
            align-items: center;
            perspective: 1200px;
        }

        .card {
            position: absolute;
            width: 320px;
            height: 380px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            padding: 25px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform: translateX(0) scale(1);
            z-index: 2;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card.left {
            transform: translateX(-450px) scale(0.75) rotateY(15deg);
            opacity: 0.8;
            z-index: 1;
        }

        .card.right {
            transform: translateX(450px) scale(0.75) rotateY(-15deg);
            opacity: 0.8;
            z-index: 1;
        }

        .card.center {
            transform: translateX(0) scale(1) rotateY(0deg);
            opacity: 1;
            z-index: 3;
        }

        .jp-word {
            font-size: 2.5em;
            font-weight: 700;
            color: #1a237e;
            margin: 0;
            font-family: 'Noto Sans', sans-serif;
        }

        .pronunciation {
            font-size: 1.2em;
            font-style: italic;
            color: #546e7a;
            margin: 12px 0;
        }

        .bengali-meaning {
            font-size: 1.6em;
            font-weight: 700;
            color: #d81b60;
            margin: 12px 0;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .comment {
            font-size: 0.95em;
            color: #263238;
            margin-top: 15px;
            line-height: 1.6;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .error {
            font-size: 1.3em;
            color: #d81b60;
            text-align: center;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        @media (max-width: 1000px) {
            .card {
                width: 280px;
                height: 340px;
            }

            .card.left {
                transform: translateX(-350px) scale(0.65) rotateY(15deg);
            }

            .card.right {
                transform: translateX(350px) scale(0.65) rotateY(-15deg);
            }

            .jp-word {
                font-size: 2.2em;
            }

            .bengali-meaning {
                font-size: 1.4em;
            }

            .comment {
                font-size: 0.85em;
            }
        }

        @media (max-width: 600px) {
            .carousel-container {
                height: 350px;
            }

            .card {
                width: 90%;
                height: 300px;
                padding: 20px;
            }

            .card.left, .card.right {
                transform: translateX(0) scale(0);
                opacity: 0;
            }

            .jp-word {
                font-size: 2em;
            }

            .bengali-meaning {
                font-size: 1.3em;
            }

            .comment {
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <div class="carousel-container"></div>

    <script>
        const jsonUrl = 'https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/refs/heads/main/lesson-1.json';
        const container = document.querySelector('.carousel-container');
        let vocabData = [];
        let currentIndex = 0;
        let intervalId = null;

        // Fetch JSON data
        async function fetchVocabData() {
            try {
                const response = await fetch(jsonUrl, { cache: 'no-store' });
                if (!response.ok) throw new Error('Failed to load JSON data');
                vocabData = await response.json();
                if (vocabData.length === 0) throw new Error('No vocabulary data found');
                initializeCarousel();
            } catch (error) {
                container.innerHTML = `<p class="error">ত্রুটি: শব্দভাণ্ডার লোড করতে ব্যর্থ হয়েছে: ${error.message}</p>`;
                console.error('Error fetching data:', error);
            }
        }

        // Create a card for a given index
        function createCard(index) {
            const word = vocabData[index];
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h1 class="jp-word">${word.jp}</h1>
                <p class="pronunciation">${word.prnc}</p>
                <p class="bengali-meaning">${word.bn}</p>
                <p class="comment">${word.cmt}</p>
            `;
            return card;
        }

        // Initialize the carousel with three cards
        function initializeCarousel() {
            if (vocabData.length === 0) return;
            container.innerHTML = '';
            updateCards();
        }

        // Update cards for the carousel
        function updateCards() {
            container.innerHTML = ''; // Clear existing cards
            const prevIndex = (currentIndex - 1 + vocabData.length) % vocabData.length;
            const nextIndex = (currentIndex + 1) % vocabData.length;

            const leftCard = createCard(prevIndex);
            const centerCard = createCard(currentIndex);
            const rightCard = createCard(nextIndex);

            leftCard.classList.add('left');
            centerCard.classList.add('center');
            rightCard.classList.add('right');

            container.appendChild(leftCard);
            container.appendChild(centerCard);
            container.appendChild(rightCard);
        }

        // Cycle to the next card
        function cycleCarousel() {
            currentIndex = (currentIndex + 1) % vocabData.length;
            updateCards();
        }

        // Start the carousel
        function startCarousel() {
            if (intervalId) clearInterval(intervalId); // Clear any existing interval
            intervalId = setInterval(cycleCarousel, 5000);
        }

        // Fetch data and start the carousel
        fetchVocabData().then(() => startCarousel());
    </script>
</body>
</html>
