<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japanese Vocabulary – Gallery Slide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --card-w: clamp(380px, 42vw, 560px);
      --card-h: clamp(420px, 65vh, 650px);
      --radius: 28px;
      --blur: 20px;
      --shadow: 0 18px 48px rgba(0, 0, 0, .45);
      --accent: #ffd54f;
      --accent-soft: #fff9c4;
      --text-light: #e8f1ff;
      --text-bn: #9be7a1;
      --glass: rgba(255, 255, 255, .10);
      --glass-border: rgba(255, 255, 255, .28);
      --fx: cubic-bezier(.4, 0, .2, 1);
      --anim-dur: 600ms;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      font-family: 'Noto Sans', "Hind Siliguri", sans-serif;
      color: white;
      background: url('https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/background-img.jpg') no-repeat center/cover;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(4, 8, 20, .70), rgba(4, 8, 20, .50));
      z-index: 0;
    }

    body::after {
      content: '';
      position: absolute;
      inset: -20%;
      background: radial-gradient(60rem 40rem at 12% 18%, rgba(255, 193, 7, .28), transparent 55%),
        radial-gradient(48rem 48rem at 88% 78%, rgba(41, 182, 246, .24), transparent 60%),
        radial-gradient(42rem 30rem at 60% 30%, rgba(129, 199, 132, .20), transparent 60%),
        conic-gradient(from 210deg at 50% 50%, rgba(255, 255, 255, .05), transparent 30%, rgba(255, 255, 255, .06), transparent 70%, rgba(255, 255, 255, .05));
      filter: blur(36px);
      mix-blend-mode: screen;
      animation: floaty 12s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes floaty {
      0% {
        transform: translateY(0) translateX(0) scale(1);
        opacity: .95;
      }

      100% {
        transform: translateY(-2%) translateX(1%) scale(1.03);
        opacity: 1;
      }
    }

    .app-frame {
      position: relative;
      width: min(96vw, 1480px);
      height: min(78vh, 680px);
      display: grid;
      z-index: 1;
    }

    .carousel {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      perspective: 1200px;
      overflow: hidden;
    }

    .card {
      position: absolute;
      width: var(--card-w);
      height: var(--card-h);
      padding: clamp(18px, 2.8vw, 32px);
      border-radius: var(--radius);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--blur));
      box-shadow: var(--shadow);
      transition: transform var(--anim-dur) var(--fx), opacity var(--anim-dur) var(--fx);
      opacity: 0;
      display: flex;
      flex-direction: column;
    }

    .card.active {
      opacity: 1;
      z-index: 2;
      transform: translateX(0) scale(1);
    }

    .card.next {
      opacity: 0.8;
      z-index: 1;
      transform: translateX(calc(var(--card-w) + 60px)) scale(0.9);
    }

    .card.prev {
      opacity: 0.8;
      z-index: 1;
      transform: translateX(calc(-1 * (var(--card-w) + 60px))) scale(0.9);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.9rem;
      color: var(--text-light);
      margin-bottom: 0.5rem;
      opacity: 0.8;
    }

    .card-header span {
      background: rgba(255, 255, 255, .08);
      padding: 6px 10px;
      border-radius: 8px;
    }

    .card-header .highlight-text {
      color: #00ff88;
      font-weight: 700;
      text-shadow: 0 0 4px rgba(0, 255, 136, 0.8),
        0 0 8px rgba(0, 255, 136, 0.7);
    }

    .card-content {
      height: 100%;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-align: center;
    }

    .card-emoji {
      font-size: clamp(2rem, 5vw, 4rem);
      display: inline-block;
      transition: transform 300ms var(--fx), text-shadow 300ms var(--fx);
      margin-top: -1.5rem;
    }

    .jp-word {
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 4px 14px rgba(0, 0, 0, .38);
      font-size: clamp(1.4rem, 3.2vw, 2.4rem);
      transition: transform 300ms var(--fx), text-shadow 300ms var(--fx);
    }

    .jp-word.highlight-word {
      transform: scale(1.03);
      text-shadow: 0 0 6px rgba(255, 213, 79, 0.8),
        0 0 14px rgba(255, 213, 79, 0.7),
        0 0 26px rgba(255, 213, 79, 0.6);
    }

    .jp-word span {
      transition: all 300ms var(--fx);
    }

    .jp-word .highlight {
      position: relative;
      color: #00ff88;
      font-weight: 900;
      text-shadow: 0 0 6px rgba(0, 255, 136, 0.8),
        0 0 14px rgba(0, 255, 136, 0.7),
        0 0 26px rgba(0, 255, 136, 0.6),
        0 0 40px rgba(0, 255, 136, 0.5);
    }

    .jp-word .highlight::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: 8px;
      padding: 2px 6px;
      background: radial-gradient(circle at center, rgba(0, 255, 136, 0.25) 0%, transparent 70%);
      transform: scale(1.3);
    }

    .pronunciation {
      font-style: italic;
      font-size: 1.2rem;
      color: #cfe8ff;
      margin-bottom: 0.5rem;
    }

    .bengali-meaning {
      font-family: "Hind Siliguri", sans-serif;
      color: var(--text-bn);
      font-weight: 700;
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }

    .comment {
      font-family: "Hind Siliguri", sans-serif;
      color: var(--text-light);
      opacity: .94;
      font-size: 0.9rem;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .08);
      max-width: 92%;
    }

    .status-bar {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      width: 280px;
      padding: 1rem;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .15);
      border: 1px solid rgba(255, 255, 255, .3);
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
      color: #e8f1ff;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .status-bar h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }

    .status-item {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .status-item span {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .progress-bar {
      height: 8px;
      background: rgba(255, 255, 255, .2);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #9be7a1, #00ff88);
      transition: width 0.5s ease-out;
    }

    .social-links {
      position: absolute;
      bottom: 2rem;
      right: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .social-link-item {
      position: absolute;
      right: -250px;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, .15);
      border: 1px solid rgba(255, 255, 255, .3);
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
      transition: right 1s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      opacity: 0;
      pointer-events: all;
    }

    .social-link-item.active {
      right: 2rem;
      opacity: 1;
    }

    .social-link-item a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .social-link-item a:hover {
      color: var(--accent);
    }

    .social-link-item a i {
      font-size: 1.2rem;
    }
  </style>
</head>

<body>
  <div class="app-frame">
    <main class="carousel" id="carousel"></main>
  </div>

  <div class="status-bar" id="statusBar">
    <h3>শব্দের প্রকারভেদ</h3>
    <div id="statusItems"></div>
  </div>

  <div class="social-links" id="socialLinks"></div>
  <script>
    const JSON_URL = 'https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/lesson-1.json';
    const root = document.getElementById('carousel');
    const statusBar = document.getElementById('statusBar');
    const statusItemsContainer = document.getElementById('statusItems');
    const socialLinksContainer = document.getElementById('socialLinks');

    let vocab = [];
    let current = 0;
    let highlightIndex = -1;
    let stats = {};
    let socialLinkIndex = 0;
    let socialLinksData = [{
      text: 'Profile: facebook.com/sdxrubel',
      icon: 'fab fa-facebook-f',
      url: 'https://www.facebook.com/sdxrubel'
    }, {
      text: 'Page: NihonGoBDAcademy',
      icon: 'fab fa-facebook-f',
      url: 'https://www.facebook.com/NihonGoBDAcademy'
    }, {
      text: 'YouTube: @sdnrubel',
      icon: 'fab fa-youtube',
      url: 'https://youtube.com/@sdnrubel'
    }, {
      text: 'TikTok: @nihongo_bd_academy',
      icon: 'fab fa-tiktok',
      url: 'https://www.tiktok.com/@nihongo_bd_academy'
    }, {
      text: 'Telegram: NihonGoBD',
      icon: 'fab fa-telegram-plane',
      url: 'https://t.me/NihonGoBD'
    }, ];

    const special_list = ['っ', 'ゃ', 'ゅ', 'ょ', 'あ', 'い', 'う', 'え', 'お', 'ん', 'ー', 'ッ', 'ャ', 'ュ', 'ョ', 'ア', 'イ', 'ウ', 'エ', 'オ', 'ン'];

    const synth = window.speechSynthesis;
    let voices = [];

    function loadVoices() {
      voices = synth.getVoices();
      if (!voices || voices.length === 0) setTimeout(loadVoices, 100);
    }
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;

    function speak(text, lang = 'ja-JP') {
      if (!text) return;
      if (!voices || voices.length === 0) {
        setTimeout(() => speak(text, lang), 50);
        return;
      }
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      const voice = voices.find(v => v.lang.startsWith(lang));
      if (voice) utter.voice = voice;
      synth.speak(utter);
    }

    function speakCurrentJpWord() {
      if (!vocab[current]) return;
      const jpWordEl = document.querySelector('.card.active .jp-word');
      if (jpWordEl) {
        jpWordEl.classList.add('highlight-word');
        setTimeout(() => {
          jpWordEl.classList.remove('highlight-word');
        }, 500);
      }
      const jpWord = vocab[current].jp ?? vocab[current].japanese;
      speak(jpWord, 'ja-JP');
    }

    function getHighlightUnits(word) {
      const units = [];
      let i = 0;
      while (i < word.length) {
        let unit = '';
        if (['あ', 'い', 'う', 'え', 'お', 'ア', 'イ', 'ウ', 'エ', 'オ'].includes(word[i])) {
          unit = word[i];
          i++;
          if (i < word.length && ['ん', 'ン'].includes(word[i])) {
            unit += word[i];
            i++;
          } else if (i < word.length && (word[i] === 'ー' || ['う', 'ウ'].includes(word[i]))) {
            unit += word[i];
            i++;
          }
          units.push(unit);
          continue;
        }
        unit = word[i];
        i++;
        if (i < word.length && ['あ', 'い', 'う', 'え', 'お', 'ア', 'イ', 'উ', 'এ', 'ও'].includes(word[i])) {
          unit += word[i];
          i++;
        }
        if (i < word.length && ['ゃ', 'ゅ', 'ょ', 'ャ', 'ュ', 'ョ'].includes(word[i])) {
          unit += word[i];
          i++;
        }
        if (i < word.length && (word[i] === 'ー' || ['う', 'উ'].includes(word[i]))) {
          unit += word[i];
          i++;
        }
        if (i < word.length && ['ん', 'ন'].includes(word[i])) {
          unit += word[i];
          i++;
        }
        if (i < word.length && ['っ', 'ッ'].includes(word[i])) {
          unit += word[i];
          i++;
          if (i < word.length) {
            unit += word[i];
            i++;
            if (i < word.length && ['ゃ', 'ゅ', 'ょ', 'ャ', 'ュ', 'ョ'].includes(word[i])) {
              unit += word[i];
              i++;
            }
            if (i < word.length && (word[i] === 'ー' || ['う', 'উ'].includes(word[i]))) {
              unit += word[i];
              i++;
            }
            if (i < word.length && ['ん', 'ন'].includes(word[i])) {
              unit += word[i];
              i++;
            }
          }
        }
        units.push(unit);
      }
      return units;
    }

    function makeCard(idx) {
      const w = vocab[idx];
      const jp = w.jp ?? w.japanese ?? '';
      const prnc = w.prnc ?? w.pronunciation ?? '';
      const bn = w.bn ?? w.meaning ?? '';
      const cmt = w.cmt ?? w.comment ?? '';
      const no = w['Phrase No'] ?? '';
      const type = w.type ?? '';
      const emoji = w.emoji ?? '';
      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.index = idx;

      const units = getHighlightUnits(jp);
      const jpHTML = units.map((unit, i) => `<span data-unit="${i}">${unit}</span>`).join('');

      el.innerHTML = `
        <div class="card-header">
            <span>Word/Phrase No: <b class="highlight-text">${no}</b></span>
            <span>Type: <b class="highlight-text">${type}</b></span>
        </div>
        <div class="card-content">
          <span class="card-emoji">${emoji}</span>
          <h1 class="jp-word">${jpHTML}</h1>
          <p class="pronunciation">${prnc}</p>
          <p class="bengali-meaning">${bn}</p>
          <p class="comment">${cmt}</b></p>
        </div>
      `;
      return el;
    }

    function highlightCharacter() {
      const activeCard = root.querySelector('.card.active');
      if (!activeCard) return;
      const spans = activeCard.querySelectorAll('.jp-word span');
      if (spans.length === 0) return;
      spans.forEach(span => span.classList.remove('highlight'));
      highlightIndex = (highlightIndex + 1) % (spans.length + 1);
      if (highlightIndex === spans.length) {
        highlightIndex = -1;
        return;
      }
      const currentSpan = spans[highlightIndex];
      if (currentSpan) {
        currentSpan.classList.add('highlight');
      }
    }

    function showCard(index) {
      const cards = root.querySelectorAll('.card');
      cards.forEach(c => c.className = 'card');
      const active = root.querySelector(`[data-index="${index}"]`);
      if (active) active.classList.add('active');
      const prevIndex = (index - 1 + vocab.length) % vocab.length;
      const nextIndex = (index + 1) % vocab.length;
      const prev = root.querySelector(`[data-index="${prevIndex}"]`);
      const next = root.querySelector(`[data-index="${nextIndex}"]`);
      if (prev) prev.classList.add('prev');
      if (next) next.classList.add('next');
      current = index;
      highlightIndex = -1;
    }

    function slideNext() {
      showCard((current + 1) % vocab.length);
    }

    function slidePrev() {
      showCard((current - 1 + vocab.length) % vocab.length);
    }

    function calculateStats() {
      const typeCounts = {};
      vocab.forEach(word => {
        const type = word.type.toLowerCase();
        typeCounts[type] = (typeCounts[type] || 0) + 1;
      });
      return typeCounts;
    }

    function updateStatusBar() {
      statusItemsContainer.innerHTML = '';
      const totalWords = vocab.length;
      for (const type in stats) {
        const count = stats[type];
        const percentage = totalWords > 0 ? (count / totalWords) * 100 : 0;
        const itemName = type.charAt(0).toUpperCase() + type.slice(1);
        const itemHTML = `
          <div class="status-item">
            <span>${itemName}: ${count}</span>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${percentage.toFixed(0)}%;"></div>
            </div>
          </div>
        `;
        statusItemsContainer.innerHTML += itemHTML;
      }
    }

    function createSocialLinks() {
      socialLinksData.forEach((link, index) => {
        const linkEl = document.createElement('div');
        linkEl.className = 'social-link-item';
        linkEl.dataset.index = index;
        linkEl.innerHTML = `
          <a href="${link.url}" target="_blank">
            <i class="${link.icon}"></i>
            <span>${link.text}</span>
          </a>
        `;
        socialLinksContainer.appendChild(linkEl);
      });
    }

    function animateSocialLinks() {
      const links = document.querySelectorAll('.social-link-item');
      if (links.length === 0) return;

      let currentLink = links[socialLinkIndex];
      currentLink.classList.remove('active');

      socialLinkIndex = (socialLinkIndex + 1) % links.length;
      let nextLink = links[socialLinkIndex];

      nextLink.classList.add('active');

      setTimeout(() => {
        nextLink.classList.remove('active');
      }, 5000);

      setTimeout(animateSocialLinks, 6000);
    }

    async function loadData() {
      try {
        const res = await fetch(JSON_URL);
        vocab = await res.json();
        stats = calculateStats();
        initCarousel();
        updateStatusBar();
        createSocialLinks();
        animateSocialLinks();
      } catch (error) {
        console.error("Failed to load data:", error);
        root.innerHTML = `<div style="color:#ff8a80; padding: 20px; font-size: 1.5rem; text-align: center;">ডাটা লোড করতে ব্যর্থ হয়েছে। অনুগ্রহ করে ইন্টারনেট সংযোগ পরীক্ষা করুন।</div>`;
      }
    }

    function initCarousel() {
      root.innerHTML = '';
      vocab.forEach((_, i) => root.append(makeCard(i)));
      if (vocab.length > 0) showCard(0);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') slideNext();
      else if (e.key === 'ArrowLeft') slidePrev();
      else if (e.key === ' ') {
        e.preventDefault();
        speakCurrentJpWord();
      } else if (e.key === 'p') {
        e.preventDefault();
        highlightCharacter();
      }
    });

    loadData();
  </script>
</body>
</html>
