<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japanese Vocabulary – Gallery Slide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --card-w: clamp(380px, 42vw, 560px);
      --card-h: clamp(400px, 58vh, 580px);
      --radius: 28px;
      --blur: 20px;
      --shadow: 0 18px 48px rgba(0, 0, 0, .45);
      --accent: #ffd54f;
      --accent-soft: #fff9c4;
      --text-light: #e8f1ff;
      --text-bn: #9be7a1;
      --glass: rgba(255, 255, 255, .10);
      --glass-border: rgba(255, 255, 255, .28);
      --fx: cubic-bezier(.4, 0, .2, 1);
      --anim-dur: 600ms;
      --progress-bg: rgba(255, 255, 255, 0.1);
      --progress-fill: #00ff88;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Noto Sans', "Hind Siliguri", sans-serif;
      color: white;
      background: url('https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/background-img.jpg') no-repeat center/cover;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(4, 8, 20, .70), rgba(4, 8, 20, .50));
      z-index: 0;
    }

    body::after {
      content: '';
      position: absolute;
      inset: -20%;
      background: radial-gradient(60rem 40rem at 12% 18%, rgba(255, 193, 7, .28), transparent 55%),
                  radial-gradient(48rem 48rem at 88% 78%, rgba(41, 182, 246, .24), transparent 60%),
                  radial-gradient(42rem 30rem at 60% 30%, rgba(129, 199, 132, .20), transparent 60%),
                  conic-gradient(from 210deg at 50% 50%, rgba(255, 255, 255, .05), transparent 30%, rgba(255, 255, 255, .06), transparent 70%, rgba(255, 255, 255, .05));
      filter: blur(36px);
      mix-blend-mode: screen;
      animation: floaty 12s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes floaty {
      0% { transform: translateY(0) translateX(0) scale(1); opacity: .95; }
      100% { transform: translateY(-2%) translateX(1%) scale(1.03); opacity: 1; }
    }

    .app-frame {
      position: relative;
      width: min(96vw, 1480px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1;
      padding: 40px 20px 100px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      width: 100%;
    }

    .profile, .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .circle-img {
      width: clamp(60px, 8vw, 80px);
      height: clamp(60px, 8vw, 80px);
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 8px;
    }

    .profile p, .logo p { font-size: 1rem; color: var(--text-light); font-weight: 600; }

    .title { text-align: center; flex-grow: 1; }
    .title h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); color: var(--accent); }

    .carousel {
      position: relative;
      width: 100%;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      overflow: visible;
      margin-top: 20px;
    }

    .card {
      position: absolute;
      width: var(--card-w);
      height: var(--card-h);
      padding: clamp(18px, 2.8vw, 32px);
      border-radius: var(--radius);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--blur));
      box-shadow: var(--shadow);
      transition: transform var(--anim-dur) var(--fx), opacity var(--anim-dur) var(--fx);
      opacity: 0;
      display: flex;
      flex-direction: column;
      transform-style: preserve-3d;
    }

    .card.active { opacity: 1; z-index: 2; transform: translateX(0) scale(1) rotateY(0deg); }
    .card.next { opacity: 0.8; z-index: 1; transform: translateX(calc(var(--card-w) * 0.6)) scale(0.9) rotateY(-10deg); }
    .card.prev { opacity: 0.8; z-index: 1; transform: translateX(calc(-1 * var(--card-w) * 0.6)) scale(0.9) rotateY(10deg); }

    .stats-panel { margin-top: 40px; }
    .footer-links { position: fixed; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div class="app-frame">
    <div class="header">
      <div class="profile">
        <img src="https://github.com/sd-rubel/n5-word-meaning-trainer/blob/main/profile.jpg?raw=true" alt="Profile" class="circle-img">
        <p>Sd Rubel</p>
      </div>
      <div class="title">
        <h1>Nihongo | JLPT N5: Vocabulary - <span class="highlight">Lesson 1</span></h1>
      </div>
      <div class="logo">
        <img src="https://github.com/sd-rubel/n5-word-meaning-trainer/blob/main/logo.jpg?raw=true" alt="Logo" class="circle-img">
        <p>NihonGoBD<br>Academy</p>
      </div>
    </div>

    <main class="carousel" id="carousel"></main>
    <div class="stats-panel" id="stats-panel"></div>

    <div class="footer-links">
      <a href="https://facebook.com/sdxrubel" class="facebook" target="_blank"><i class="fab fa-facebook-f"></i>facebook.com/sdxrubel</a>
      <a href="https://youtube.com/@sdnrubel" class="youtube" target="_blank"><i class="fab fa-youtube"></i>youtube.com/@sdnrubel</a>
    </div>
  </div>
  
  <script>
    const JSON_URL = 'https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/lesson-1.json';
    const root = document.getElementById('carousel');
    const statsPanel = document.getElementById('stats-panel');
    let vocab = [];
    let current = 0;
    let highlightIndex = -1;
    const special_list = ['っ', 'ゃ', 'ゅ', 'ょ', 'あ', 'い', 'う', 'え', 'お', 'ん', 'ー', 'ッ', 'ャ', 'ュ', 'ョ', 'ア', 'イ', 'ウ', 'エ', 'オ', 'ン'];

    const synth = window.speechSynthesis;
    let voices = [];

    function loadVoices() {
      voices = synth.getVoices();
      if (!voices || voices.length === 0) setTimeout(loadVoices, 100);
    }
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;

    function speak(text, lang = 'ja-JP') {
      if (!text) return;
      if (!voices || voices.length === 0) {
        setTimeout(() => speak(text, lang), 50);
        return;
      }
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      const voice = voices.find(v => v.lang.startsWith(lang));
      if (voice) utter.voice = voice;
      synth.speak(utter);
    }

    function speakCurrentJpWord() {
      if (!vocab[current]) return;
      const jpWordEl = document.querySelector('.card.active .jp-word');
      if (jpWordEl) {
        jpWordEl.classList.add('highlight-word');
        setTimeout(() => {
          jpWordEl.classList.remove('highlight-word');
        }, 500);
      }
      const jpWord = vocab[current].jp ?? vocab[current].japanese;
      speak(jpWord, 'ja-JP');
    }

    function getHighlightUnits(word) {
      const units = [];
      let i = 0;
      while (i < word.length) {
        let unit = '';
        if (['あ', 'い', 'う', 'え', 'お', 'ア', 'ই', 'উ', 'এ', 'ও'].includes(word[i])) {
          unit = word[i];
          i++;
          if (i < word.length && ['ん', 'ン'].includes(word[i])) {
            unit += word[i];
            i++;
          } else if (i < word.length && (word[i] === 'ー' || ['う', 'উ'].includes(word[i]))) {
              unit += word[i];
              i++;
          }
          units.push(unit);
          continue;
        }
        unit = word[i];
        i++;
        if (i < word.length && ['ゃ', 'ゅ', 'ょ', 'ャ', 'ュ', 'ョ'].includes(word[i])) {
          unit += word[i];
          i++;
        }
        if (i < word.length && (word[i] === 'ー' || ['う', 'উ'].includes(word[i]))) {
          unit += word[i];
          i++;
        }
        if (i < word.length && ['ん', 'ン'].includes(word[i])) {
          unit += word[i];
          i++;
        }
        if (i < word.length && ['っ', 'ッ'].includes(word[i])) {
          unit += word[i];
          i++;
          if (i < word.length) {
            unit += word[i];
            i++;
            if (i < word.length && ['ゃ', 'ゅ', 'ょ', 'ャ', 'ュ', 'ョ'].includes(word[i])) {
              unit += word[i];
              i++;
            }
            if (i < word.length && (word[i] === 'ー' || ['う', 'উ'].includes(word[i]))) {
              unit += word[i];
              i++;
            }
            if (i < word.length && ['ん', 'ন'].includes(word[i])) {
              unit += word[i];
              i++;
            }
          }
        }
        units.push(unit);
      }
      return units;
    }

    function makeCard(idx) {
      const w = vocab[idx];
      const jp = w.jp ?? w.japanese ?? '';
      const prnc = w.prnc ?? w.pronunciation ?? '';
      const bn = w.bn ?? w.meaning ?? '';
      const cmt = w.cmt ?? w.comment ?? '';
      const no = w['Phrase No'] ?? '';
      const type = w.type ?? '';
      const emoji = w.emoji ?? '';
      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.index = idx;

      const units = getHighlightUnits(jp);
      const jpHTML = units.map((unit, i) => `<span data-unit="${i}">${unit}</span>`).join('');

      el.innerHTML = `
        <div class="card-header">
          <span>Word/Phrase No: <b class="highlight-text">${no}</b></span>
          <span>Type: <b class="highlight-text">${type}</b></span>
        </div>
        <div class="card-content">
          <span class="card-emoji">${emoji}</span>
          <h1 class="jp-word">${jpHTML}</h1>
          <p class="pronunciation">${prnc}</p>
          <p class="bengali-meaning">${bn}</p>
          <p class="comment">${cmt}</p>
        </div>
      `;
      return el;
    }

    function highlightCharacter() {
      const activeCard = root.querySelector('.card.active');
      if (!activeCard) return;
      const spans = activeCard.querySelectorAll('.jp-word span');
      if (spans.length === 0) return;
      spans.forEach(span => span.classList.remove('highlight'));
      highlightIndex = (highlightIndex + 1) % (spans.length + 1);
      if (highlightIndex === spans.length) {
        highlightIndex = -1;
        return;
      }
      const currentSpan = spans[highlightIndex];
      if (currentSpan) {
        currentSpan.classList.add('highlight');
      }
    }

    let stats = {};

    function updateStats() {
      stats = {};
      vocab.forEach((word, idx) => {
        const type = word.type || 'Unknown';
        if (!stats[type]) {
          stats[type] = { total: 0, viewed: new Set(), bengali: type };
        }
        stats[type].total++;
        if (idx <= current) {
          stats[type].viewed.add(idx);
        }
      });

      statsPanel.innerHTML = '';
      Object.entries(stats).forEach(([type, data]) => {
        const bengaliType = {
          'Noun': 'বিশেষ্য',
          'Pronoun': 'সর্বনাম',
          'Verb': 'ক্রিয়া',
          'Suffix': 'প্রত্যয়',
          'Adjective': 'বিশেষণ',
          'Adverb': 'ক্রিয়া বিশেষণ',
          'Particle': 'কণা',
          'Conjunction': 'সংযোজক',
          'Interjection': 'বিস্ময়সূচক',
          'Unknown': 'অজানা'
        }[type] || type;

        const statsItem = document.createElement('div');
        statsItem.className = 'stats-item';
        statsItem.innerHTML = `
          <h3>${bengaliType}</h3>
          <span>${type}: <span id="${type.toLowerCase()}-count">${data.total}</span></span>
          <div class="progress-container">
            <div class="progress-bar" id="${type.toLowerCase()}-progress" style="width: ${data.total ? (data.viewed.size / data.total) * 100 : 0}%"></div>
          </div>
        `;
        statsPanel.appendChild(statsItem);
      });
    }

    function showCard(index) {
      const cards = root.querySelectorAll('.card');
      cards.forEach(c => c.className = 'card');
      const active = root.querySelector(`[data-index="${index}"]`);
      if (active) active.classList.add('active');
      const prevIndex = (index - 1 + vocab.length) % vocab.length;
      const nextIndex = (index + 1) % vocab.length;
      const prev = root.querySelector(`[data-index="${prevIndex}"]`);
      const next = root.querySelector(`[data-index="${nextIndex}"]`);
      if (prev) prev.classList.add('prev');
      if (next) next.classList.add('next');
      current = index;
      highlightIndex = -1;
      updateStats();
    }

    function slideNext() {
      showCard((current + 1) % vocab.length);
    }

    function slidePrev() {
      showCard((current - 1 + vocab.length) % vocab.length);
    }

    async function loadData() {
      try {
        const res = await fetch(JSON_URL);
        vocab = await res.json();
        initCarousel();
        updateStats();
      } catch {
        root.innerHTML = `<div style="color:#ff8a80;">লোড ব্যর্থ</div>`;
      }
    }

    function initCarousel() {
      root.innerHTML = '';
      vocab.forEach((_, i) => root.append(makeCard(i)));
      if (vocab.length > 0) showCard(0);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') slideNext();
      else if (e.key === 'ArrowLeft') slidePrev();
      else if (e.key === ' ') {
        e.preventDefault();
        speakCurrentJpWord();
      } else if (e.key === 'p') {
        e.preventDefault();
        highlightCharacter();
      }
    });

    loadData();
  </script>
</body>
</html>
