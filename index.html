<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Vocabulary Carousel</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(90deg, #d4a4eb, #f8bbd0);
            font-family: 'Noto Sans', sans-serif;
            overflow: hidden;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .card {
            position: absolute;
            width: 300px;
            height: 400px;
            background: linear-gradient(135deg, #78909c, #546e7a);
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.6s ease-in-out;
            transform: translateX(0) scale(1);
            z-index: 2;
            color: #ffffff;
        }

        .card.left {
            transform: translateX(-400px) scale(0.7) rotateY(10deg);
            opacity: 0.7;
            z-index: 1;
        }

        .card.right {
            transform: translateX(400px) scale(0.7) rotateY(-10deg);
            opacity: 0.7;
            z-index: 1;
        }

        .card.center {
            transform: translateX(0) scale(1) rotateY(0deg);
            opacity: 1;
            z-index: 3;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .jp-word {
            font-size: 2.5em;
            font-weight: 700;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .pronunciation {
            font-size: 1.2em;
            font-style: italic;
            margin: 10px 0;
        }

        .bengali-meaning {
            font-size: 1.6em;
            font-weight: 700;
            margin: 10px 0;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .comment {
            font-size: 0.9em;
            margin-top: 15px;
            line-height: 1.6;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .error {
            font-size: 1.3em;
            color: #be185d;
            text-align: center;
            font-family: 'Noto Sans Bengali', sans-serif;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        @media (max-width: 900px) {
            .carousel-container {
                max-width: 800px;
                height: 400px;
            }

            .card {
                width: 250px;
                height: 350px;
            }

            .card.left {
                transform: translateX(-300px) scale(0.6) rotateY(10deg);
            }

            .card.right {
                transform: translateX(300px) scale(0.6) rotateY(-10deg);
            }

            .jp-word {
                font-size: 2.2em;
            }

            .bengali-meaning {
                font-size: 1.4em;
            }

            .comment {
                font-size: 0.85em;
            }
        }

        @media (max-width: 600px) {
            .carousel-container {
                height: 350px;
            }

            .card {
                width: 90%;
                max-width: 300px;
                height: 300px;
            }

            .card.left, .card.right {
                transform: translateX(0) scale(0);
                opacity: 0;
            }

            .jp-word {
                font-size: 2em;
            }

            .bengali-meaning {
                font-size: 1.3em;
            }

            .comment {
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <div class="carousel-container"></div>

    <script>
        const jsonUrl = 'https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/refs/heads/main/lesson-1.json';
        const container = document.querySelector('.carousel-container');
        let vocabData = [];
        let currentIndex = 0;
        let intervalId = null;

        // Fetch JSON data
        async function fetchVocabData() {
            try {
                const response = await fetch(jsonUrl, { cache: 'no-store' });
                if (!response.ok) throw new Error('Failed to load JSON data');
                vocabData = await response.json();
                if (vocabData.length === 0) throw new Error('No vocabulary data found');
                initializeCarousel();
            } catch (error) {
                container.innerHTML = `<p class="error">ত্রুটি: শব্দভাণ্ডার লোড করতে ব্যর্থ হয়েছে: ${error.message}</p>`;
                console.error('Error fetching data:', error);
            }
        }

        // Create a card for a given index
        function createCard(index) {
            const word = vocabData[index];
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h1 class="jp-word">${word.jp}</h1>
                <p class="pronunciation">${word.prnc}</p>
                <p class="bengali-meaning">${word.bn}</p>
                <p class="comment">${word.cmt}</p>
            `;
            return card;
        }

        // Initialize or update the carousel with exactly three cards
        function updateCarousel() {
            container.innerHTML = ''; // Clear existing cards
            const prevIndex = (currentIndex - 1 + vocabData.length) % vocabData.length;
            const currentCardIndex = currentIndex;
            const nextIndex = (currentIndex + 1) % vocabData.length;

            const leftCard = createCard(prevIndex);
            const centerCard = createCard(currentCardIndex);
            const rightCard = createCard(nextIndex);

            leftCard.classList.add('left');
            centerCard.classList.add('center');
            rightCard.classList.add('right');

            container.appendChild(leftCard);
            container.appendChild(centerCard);
            container.appendChild(rightCard);

            // Increment index for next cycle
            currentIndex = (currentIndex + 1) % vocabData.length;
        }

        // Initialize the carousel
        function initializeCarousel() {
            if (vocabData.length === 0) return;
            updateCarousel();
            startCarousel();
        }

        // Start the carousel with a 5-second interval
        function startCarousel() {
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(updateCarousel, 5000);
        }

        // Fetch data and start the carousel
        fetchVocabData();
    </script>
</body>
</html>
