<head>

    <title>Japanese Vocabulary Flashcards</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&family=Noto+Sans+Bengali&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f4f8;
            font-family: 'Noto Sans', sans-serif;
        }

        .card {
            width: 350px;
            height: 400px;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }

        .card.fade {
            opacity: 0;
        }

        .jp-word {
            font-size: 2.5em;
            color: #2c3e50;
            margin: 0;
            font-family: 'Noto Sans', sans-serif;
        }

        .pronunciation {
            font-size: 1.2em;
            color: #7f8c8d;
            margin: 10px 0;
        }

        .bengali-meaning {
            font-size: 1.5em;
            color: #e74c3c;
            margin: 10px 0;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .comment {
            font-size: 1em;
            color: #34495e;
            margin-top: 15px;
            line-height: 1.5;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        @media (max-width: 400px) {
            .card {
                width: 90%;
                height: 350px;
                padding: 15px;
            }

            .jp-word {
                font-size: 2em;
            }

            .bengali-meaning {
                font-size: 1.3em;
            }

            .comment {
                font-size: 0.9em;
            }
        }
    </style>
</head>

        const comment = document.querySelector('.comment');

        let currentIndex = 0;

        function displayWord(index) {
            card.classList.add('fade');
            setTimeout(() => {
                const word = vocabData[index];
                jpWord.textContent = word.jp;
                pronunciation.textContent = word.prnc;
                bengaliMeaning.textContent = word.bn;
                comment.textContent = word.cmt;
                card.classList.remove('fade');
            }, 500); // Match the CSS transition duration
        }

        function cycleWords() {
            displayWord(currentIndex);
            currentIndex = (currentIndex + 1) % vocabData.length;
        }

        // Initial display
        displayWord(currentIndex);

        // Cycle every 5 seconds
        setInterval(cycleWords, 5000);
