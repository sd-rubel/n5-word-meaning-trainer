<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Japanese Vocabulary – Minimal Carousel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    /* ============== RESET ============== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root{
      --card-w: clamp(380px, 42vw, 560px);
      --card-h: clamp(380px, 60vh, 600px); /* Increased card height */
      --radius: 28px;
      --blur: 20px;
      --shadow: 0 18px 48px rgba(0,0,0,.45);
      --accent: #ffd54f;
      --accent-soft: #ffe082;
      --text-light: #e8f1ff;
      --text-bn: #9be7a1;
      --glass: rgba(255,255,255,.10);
      --glass-border: rgba(255,255,255,.28);
      --fx: cubic-bezier(.4,0,.2,1);
      --anim-dur: 900ms;
    }

    @media (prefers-reduced-motion: reduce) {
      :root{ --anim-dur: 120ms; }
    }

    /* ============== STAGE ============== */
    body{
      min-height: 100svh;
      display: grid;
      place-items: center;
      font-family: 'Noto Sans', system-ui, -apple-system, Segoe UI, Roboto, "Hind Siliguri", sans-serif;
      color: white;
      background:
        url('https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/background-img.jpg')
        no-repeat center/cover;
      position: relative;
      overflow: hidden;
    }

    /* Dark veil */
    body::before{
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(120deg, rgba(4,8,20,.70), rgba(4,8,20,.50));
      z-index: 0;
    }

    /* UI Gradient Overlay (animated, soft) */
    body::after{
      content:'';
      position: absolute; inset: -20%;
      background:
        radial-gradient(60rem 40rem at 12% 18%, rgba(255,193,7,.28), transparent 55%),
        radial-gradient(48rem 48rem at 88% 78%, rgba(41,182,246,.24), transparent 60%),
        radial-gradient(42rem 30rem at 60% 30%, rgba(129,199,132,.20), transparent 60%),
        conic-gradient(from 210deg at 50% 50%, rgba(255,255,255,.05), transparent 30%, rgba(255,255,255,.06), transparent 70%, rgba(255,255,255,.05));
      filter: blur(36px);
      mix-blend-mode: screen;
      animation: floaty 12s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }
    @keyframes floaty {
      0%   { transform: translateY(0) translateX(0) scale(1); opacity: .95; }
      100% { transform: translateY(-2%) translateX(1%) scale(1.03); opacity: 1; }
    }

    /* ============== WRAPPER ============== */
    .app-frame{
      position: relative;
      width: min(96vw, 1480px);
      height: min(78vh, 680px);
      display: grid;
      grid-template-rows: 1fr;
      z-index: 1;
    }

    /* ============== CAROUSEL ============== */
    .carousel{
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      perspective: 1200px;
      overflow: hidden;
    }

    .card{
      position: absolute;
      width: var(--card-w);
      height: var(--card-h);
      padding: clamp(18px, 2.8vw, 32px);
      border-radius: var(--radius);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--blur));
      box-shadow: var(--shadow);
      opacity: 0;
      transition: opacity 800ms ease-in-out;
      transform: scale(0.9);
    }
    .card.active{
        opacity: 1;
        z-index: 1;
        transform: scale(1);
    }
    .card.hidden{
        opacity: 0;
        z-index: 0;
        transform: scale(0.9);
    }

    /* ============== CONTENT ============== */
    .card-content{
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto auto auto 1fr;
      align-items: center;
      justify-items: center;
      gap: clamp(6px, 1.2vw, 12px);
      text-align: center;
    }

    .jp-word-container {
        display: flex;
        justify-content: center;
        gap: 0;
        flex-wrap: nowrap;
        white-space: nowrap;
        transition: gap 0.5s ease-in-out;
        width: 100%;
    }
    
    .jp-word-container.spaced {
      gap: 15px;
    }

    .jp-char {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .jp-char span.char {
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: .3px;
      color: var(--accent);
      text-shadow: 0 4px 14px rgba(0,0,0,.38);
      font-size: clamp(2.1rem, 4.6vw, 3.8rem);
      transition: transform 0.6s ease-in-out;
    }
    
    .jp-char span.char.scaled-up {
      transform: scale(1.4);
    }

    .jp-char span.romaji {
      font-size: 1.1rem;
      color: #b0e0e6;
      margin-top: 5px;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
    
    .jp-char span.romaji.show {
        opacity: 1;
    }
    
    .pronunciation{
      font-style: italic;
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      color: #cfe8ff;
      opacity: .95;
    }

    .bengali-meaning{
      font-family: "Hind Siliguri", sans-serif;
      color: var(--text-bn);
      font-weight: 700;
      font-size: clamp(1.35rem, 2.8vw, 2rem);
      text-shadow: 0 2px 8px rgba(0,0,0,.28);
    }

    .comment{
      font-family: "Hind Siliguri", sans-serif;
      color: var(--text-light);
      opacity: .94;
      font-size: clamp(.95rem, 1.8vw, 1.12rem);
      line-height: 1.7;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      max-width: 92%;
    }

    /* Responsive tweaks */
    @media (max-width: 1100px){
      .card.left, .card.right{ opacity: 0; }
    }
    @media (max-width: 720px){
      :root{ --card-w: min(94vw, 560px); --card-h: min(80vh, 600px); }
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <main class="carousel" id="carousel"></main>
  </div>

  <script>
    /* ================== DATA & SETUP ================== */
    const JSON_URL = 'https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/lesson-1.json';
    const root = document.getElementById('carousel');

    let vocab = [];
    let current = 0;
    let isSpeaking = false;

    // Use Web Speech API for pronunciation
    const synth = window.speechSynthesis;

    async function loadData(retries = 3){
      try{
        const res = await fetch(JSON_URL, {cache: 'no-store'});
        if(!res.ok) throw new Error('Failed to load JSON');
        const data = await res.json();
        if(!Array.isArray(data) || !data.length) throw new Error('No vocabulary found');
        vocab = data;
        initCarousel();
      }catch(e){
        if(retries>0){
          await new Promise(r=>setTimeout(r,1500));
          return loadData(retries-1);
        }
        root.innerHTML = `<div style="padding:20px;border-radius:14px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.25);">
          <div style="font-family:'Hind Siliguri',sans-serif;font-size:1.1rem;color:#ff8a80;">ত্রুটি:</div>
          <div style="margin-top:6px;color:#fff;">${e.message}</div>
        </div>`;
      }
    }

    /* ================== SPEECH & ANIMATION ================== */
    function speak(text, lang = 'ja-JP', onEnd = null) {
      if (!synth || !text) {
        if (onEnd) onEnd();
        return;
      }
      
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      
      const availableVoices = synth.getVoices();
      const voice = availableVoices.find(v => v.lang.startsWith(lang));
      if (voice) {
        utter.voice = voice;
      }
      
      utter.onend = onEnd;
      synth.speak(utter);
    }
    
    // Function to split Japanese text by characters, including combined ones
    function getJapaneseChars(text) {
        const hiraganaMap = {
            'きゃ': 'kya', 'きゅ': 'kyu', 'きょ': 'kyo',
            'しゃ': 'sha', 'しゅ': 'shu', 'しょ': 'sho',
            'ちゃ': 'cha', 'ちゅ': 'chu', 'ちょ': 'cho',
            'にゃ': 'nya', 'にゅ': 'nyu', 'にょ': 'nyo',
            'ひゃ': 'hya', 'ひゅ': 'hyu', 'ひょ': 'hyo',
            'みゃ': 'mya', 'みゅ': 'myu', 'みょ': 'myo',
            'りゃ': 'rya', 'りゅ': 'ryu', 'りょ': 'ryo',
            'ぎゃ': 'gya', 'ぎゅ': 'gyu', 'ぎょ': 'gyo',
            'じゃ': 'ja', 'じゅ': 'ju', 'じょ': 'jo',
            'びゃ': 'bya', 'びゅ': 'byu', 'びょ': 'byo',
            'ぴゃ': 'pya', 'ぴゅ': 'pyu', 'ぴょ': 'pyo',
            'っ': 'っ', // Sokuon
            'ー': 'ー', // Chouon
            'あ': 'a', 'い': 'i', 'う': 'u', 'え': 'e', 'お': 'o',
            'か': 'ka', 'き': 'ki', 'く': 'ku', 'け': 'ke', 'こ': 'ko',
            'さ': 'sa', 'し': 'shi', 'す': 'su', 'せ': 'se', 'そ': 'so',
            'た': 'ta', 'ち': 'chi', 'つ': 'tsu', 'て': 'te', 'と': 'to',
            'な': 'na', 'に': 'ni', 'ぬ': 'nu', 'ね': 'ne', 'の': 'no',
            'は': 'ha', 'ひ': 'hi', 'ふ': 'fu', 'へ': 'he', 'ほ': 'ho',
            'ま': 'ma', 'み': 'mi', 'む': 'mu', 'め': 'me', 'も': 'mo',
            'や': 'ya', 'ゆ': 'yu', 'よ': 'yo',
            'ら': 'ra', 'り': 'ri', 'る': 'ru', 'れ': 're', 'ろ': 'ro',
            'わ': 'wa', 'を': 'o', 'ん': 'n',
            'が': 'ga', 'ぎ': 'gi', 'ぐ': 'gu', 'げ': 'ge', 'ご': 'go',
            'ざ': 'za', 'じ': 'ji', 'ず': 'zu', 'ぜ': 'ze', 'ぞ': 'zo',
            'だ': 'da', 'ぢ': 'ji', 'づ': 'zu', 'で': 'de', 'ど': 'do',
            'ば': 'ba', 'び': 'bi', 'ぶ': 'bu', 'べ': 'be', 'ぼ': 'bo',
            'ぱ': 'pa', 'ぴ': 'pi', 'ぷ': 'pu', 'ぺ': 'pe', 'ぽ': 'po',
            'ヴ': 'vu',
            'ゐ': 'wi', 'ゑ': 'we', 'を': 'wo' // archaic
        };

        const chars = [];
        let i = 0;
        while (i < text.length) {
            let combined = text.substring(i, i + 2);
            if (hiraganaMap[combined]) {
                chars.push({ char: combined, romaji: hiraganaMap[combined] });
                i += 2;
            } else if (hiraganaMap[text[i]]) {
                chars.push({ char: text[i], romaji: hiraganaMap[text[i]] });
                i++;
            } else {
                chars.push({ char: text[i], romaji: text[i] });
                i++;
            }
        }
        return chars;
    }

    async function animateAndSpeakChars() {
        const currentWord = vocab[current];
        const jpChars = getJapaneseChars(currentWord.jp);
        
        const wordContainer = document.querySelector('.card.active .jp-word-container');
        wordContainer.innerHTML = '';
        
        jpChars.forEach(item => {
            const charDiv = document.createElement('div');
            charDiv.className = 'jp-char';
            charDiv.innerHTML = `
                <span class="char">${item.char}</span>
                <span class="romaji">${item.romaji}</span>
            `;
            wordContainer.appendChild(charDiv);
        });

        // Add gap to container
        wordContainer.classList.add('spaced');

        // Animate each character
        const charElements = wordContainer.querySelectorAll('.jp-char');
        for (let i = 0; i < charElements.length; i++) {
            const charSpan = charElements[i].querySelector('.char');
            const romajiSpan = charElements[i].querySelector('.romaji');
            
            charSpan.classList.add('scaled-up');
            romajiSpan.classList.add('show');
            speak(jpChars[i].char, 'ja-JP');
            
            await new Promise(resolve => setTimeout(resolve, 800)); // Gap between each character animation
        }
    }

    async function processCurrentCard() {
        if(isSpeaking || vocab.length === 0) return;
        isSpeaking = true;

        const currentWord = vocab[current];
        const jpWordEl = document.querySelector('.card.active .jp-word-container');
        
        // Reset container for full word
        jpWordEl.classList.remove('spaced');
        jpWordEl.innerHTML = `<span class="char">${currentWord.jp}</span>`;

        // 1. Speak the full Japanese word (1st time)
        await new Promise(resolve => speak(currentWord.jp, 'ja-JP', () => resolve()));
        await new Promise(resolve => setTimeout(resolve, 2000)); // 2s pause

        // 2. Animate and speak character by character
        await animateAndSpeakChars();
        await new Promise(resolve => setTimeout(resolve, 2000)); // 2s pause

        // 3. Speak the full Japanese word (3rd time)
        await new Promise(resolve => speak(currentWord.jp, 'ja-JP', () => resolve()));
        
        isSpeaking = false;
        
        // Wait for a few seconds before sliding to the next card
        setTimeout(slideNext, 3000);
    }

    /* ================== CAROUSEL LOGIC ================== */
    function makeCard(){
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `
            <div class="card-content">
                <div class="spacer"></div>
                <div class="jp-word-container"></div>
                <p class="pronunciation"></p>
                <p class="bengali-meaning"></p>
                <p class="comment"></p>
                <div class="spacer"></div>
            </div>
        `;
        return el;
    }

    function fillCard(card, idx){
        const w = vocab[idx];
        const jp   = w.jp ?? w.japanese ?? '';
        const prnc = w.prnc ?? w.pronunciation ?? '';
        const bn   = w.bn ?? w.meaning ?? '';
        const cmt  = w.cmt ?? w.comment ?? '';

        // Fill other content
        card.querySelector('.pronunciation').textContent = prnc;
        card.querySelector('.bengali-meaning').textContent = bn;
        card.querySelector('.comment').textContent = cmt;
    }

    function slideNext(){
        if(isSpeaking) return;

        const oldCard = document.querySelector('.card.active');
        if (oldCard) {
            oldCard.classList.remove('active');
            oldCard.classList.add('hidden');
        }

        current = (current + 1) % vocab.length;
        const nextCard = root.querySelector(`[data-index="${current}"]`);
        
        if(nextCard){
            nextCard.classList.remove('hidden');
            nextCard.classList.add('active');
            processCurrentCard();
        } else {
            initCarousel();
        }
    }
    
    function initCarousel(){
        root.innerHTML = '';
        for (let i = 0; i < vocab.length; i++) {
            const card = makeCard();
            card.setAttribute('data-index', i);
            fillCard(card, i);
            root.append(card);
        }

        const initialCard = root.querySelector(`[data-index="${current}"]`);
        if(initialCard) {
            initialCard.classList.add('active');
            processCurrentCard();
        }
    }

    // Kickoff
    loadData();
  </script>
</body>
</html>
