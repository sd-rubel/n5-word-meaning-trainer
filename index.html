<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Japanese Vocabulary Carousel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: url('https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/background-img.jpg') no-repeat center center/cover;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.1));
            z-index: 0;
            animation: bubbleAnimation 10s infinite ease-in-out;
        }

        @keyframes bubbleAnimation {
            0% { background-size: 100% 100%; }
            50% { background-size: 120% 120%; }
            100% { background-size: 100% 100%; }
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            z-index: 1;
        }

        .card {
            position: absolute;
            width: 400px;
            height: 450px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transform-style: preserve-3d;
            z-index: 2;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card.left {
            transform: translateX(-600px) scale(0.7) rotateY(15deg);
            opacity: 0.6;
            z-index: 1;
        }

        .card.right {
            transform: translateX(600px) scale(0.7) rotateY(-15deg);
            opacity: 0.6;
            z-index: 1;
        }

        .card.center {
            transform: translateX(0) scale(1) rotateY(0deg);
            opacity: 1;
            z-index: 3;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.15), transparent);
            border-radius: 25px;
            z-index: -1;
        }

        .card-content {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .jp-word {
            font-size: 3.2em;
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            font-family: 'Noto Sans', sans-serif;
        }

        .pronunciation {
            font-size: 1.5em;
            font-style: italic;
            color: #b3e5fc;
            margin: 15px 0;
            font-family: 'Noto Sans', sans-serif;
        }

        .bengali-meaning {
            font-size: 2em;
            font-weight: 700;
            color: #81c784;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            font-family: 'Hind Siliguri', sans-serif;
        }

        .comment {
            font-size: 1.2em;
            color: #e0e0e0;
            margin-top: 20px;
            line-height: 1.8;
            font-family: 'Hind Siliguri', sans-serif;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        .error {
            font-size: 1.5em;
            color: #ef4444;
            text-align: center;
            font-family: 'Hind Siliguri', sans-serif;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            z-index: 2;
        }

        @keyframes gallerySlideIn {
            0% { transform: translateX(1200px) scale(0.6); opacity: 0; }
            50% { transform: translateX(-50px) scale(1.1); opacity: 0.9; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }

        @keyframes gallerySlideOut {
            0% { transform: translateX(0) scale(1); opacity: 1; }
            100% { transform: translateX(-1200px) scale(0.6); opacity: 0; }
        }

        .card.center.enter {
            animation: gallerySlideIn 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .card.left.exit {
            animation: gallerySlideOut 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @media (max-width: 1100px) {
            .carousel-container {
                max-width: 1000px;
                height: 450px;
            }

            .card {
                width: 350px;
                height: 400px;
            }

            .card.left {
                transform: translateX(-500px) scale(0.65) rotateY(15deg);
            }

            .card.right {
                transform: translateX(500px) scale(0.65) rotateY(-15deg);
            }

            .jp-word {
                font-size: 2.8em;
            }

            .bengali-meaning {
                font-size: 1.8em;
            }

            .comment {
                font-size: 1.1em;
            }
        }

        @media (max-width: 700px) {
            .carousel-container {
                height: 350px;
            }

            .card {
                width: 90%;
                max-width: 350px;
                height: 300px;
            }

            .card.left, .card.right {
                transform: translateX(0) scale(0);
                opacity: 0;
            }

            .jp-word {
                font-size: 2.2em;
            }

            .bengali-meaning {
                font-size: 1.4em;
            }

            .comment {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="carousel-container"></div>

    <script>
        const jsonUrl = 'https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/refs/heads/main/lesson-1.json';
        const container = document.querySelector('.carousel-container');
        let vocabData = [];
        let currentIndex = 0;
        let intervalId = null;

        // Fetch JSON data with retry mechanism
        async function fetchVocabData(retries = 3) {
            try {
                const response = await fetch(jsonUrl, { cache: 'no-store' });
                if (!response.ok) throw new Error('Failed to load JSON data');
                vocabData = await response.json();
                if (vocabData.length === 0) throw new Error('No vocabulary data found');
                initializeCarousel();
            } catch (error) {
                if (retries > 0) {
                    console.warn(`Retry attempt ${4 - retries} due to: ${error.message}`);
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    return fetchVocabData(retries - 1);
                }
                container.innerHTML = `<p class="error">ত্রুটি: শব্দভাণ্ডার লোড করতে ব্যর্থ হয়েছে: ${error.message}. পুনরায় চেষ্টা করুন।</p>`;
                console.error('Error fetching data:', error);
            }
        }

        // Create a card for a given index
        function createCard(index, className = 'card') {
            const word = vocabData[index];
            const card = document.createElement('div');
            card.className = `${className}`;
            card.innerHTML = `
                <div class="card-content">
                    <h1 class="jp-word">${word.jp}</h1>
                    <p class="pronunciation">${word.prnc}</p>
                    <p class="bengali-meaning">${word.bn}</p>
                    <p class="comment">${word.cmt}</p>
                </div>
            `;
            return card;
        }

        // Initialize or update the carousel with exactly three cards
        function updateCarousel() {
            container.innerHTML = '';
            const prevIndex = (currentIndex - 1 + vocabData.length) % vocabData.length;
            const currentCardIndex = currentIndex;
            const nextIndex = (currentIndex + 1) % vocabData.length;

            // Create and position cards with animation classes
            const leftCard = createCard(prevIndex, 'card left');
            const centerCard = createCard(currentCardIndex, 'card center');
            const rightCard = createCard(nextIndex, 'card right enter');

            container.appendChild(leftCard);
            container.appendChild(centerCard);
            container.appendChild(rightCard);

            // Apply exit animation to the old center card
            const oldCenter = container.querySelector('.center');
            if (oldCenter) oldCenter.classList.add('exit');

            // Remove animation classes after transition
            setTimeout(() => {
                const center = container.querySelector('.center');
                const exiting = container.querySelector('.exit');
                if (center) center.classList.remove('enter', 'exit');
                if (exiting) exiting.remove();
            }, 1000); // Match animation duration

            // Increment index for next cycle
            currentIndex = (currentIndex + 1) % vocabData.length;
        }

        // Initialize the carousel
        function initializeCarousel() {
            if (vocabData.length === 0) return;
            updateCarousel();
            startCarousel();
        }

        // Start the carousel with a 5-second interval
        function startCarousel() {
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(() => {
                updateCarousel();
            }, 5000);
        }

        // Fetch data and start the carousel
        fetchVocabData();
    </script>
</body>
</html>
