<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Vocabulary Carousel</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&family=Noto+Sans+Bengali&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f4f8;
            font-family: 'Noto Sans', sans-serif;
            overflow: hidden;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 400px;
            display: flex;
            align-items: center;
            perspective: 1000px;
        }

        .card {
            position: absolute;
            width: 300px;
            height: 350px;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.8s ease-in-out;
            transform: translateX(0) scale(1);
            z-index: 2;
        }

        .card.left {
            transform: translateX(-400px) scale(0.7);
            opacity: 0.7;
            z-index: 1;
        }

        .card.right {
            transform: translateX(400px) scale(0.7);
            opacity: 0.7;
            z-index: 1;
        }

        .card.center {
            transform: translateX(0) scale(1);
            opacity: 1;
            z-index: 3;
        }

        .jp-word {
            font-size: 2.2em;
            color: #2c3e50;
            margin: 0;
            font-family: 'Noto Sans', sans-serif;
        }

        .pronunciation {
            font-size: 1.1em;
            color: #7f8c8d;
            margin: 10px 0;
        }

        .bengali-meaning {
            font-size: 1.4em;
            color: #e74c3c;
            margin: 10px 0;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .comment {
            font-size: 0.9em;
            color: #34495e;
            margin-top: 15px;
            line-height: 1.5;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .error {
            font-size: 1.2em;
            color: #e74c3c;
            text-align: center;
        }

        @media (max-width: 900px) {
            .card {
                width: 250px;
                height: 300px;
            }

            .card.left {
                transform: translateX(-300px) scale(0.6);
            }

            .card.right {
                transform: translateX(300px) scale(0.6);
            }

            .jp-word {
                font-size: 1.8em;
            }

            .bengali-meaning {
                font-size: 1.2em;
            }

            .comment {
                font-size: 0.8em;
            }
        }

        @media (max-width: 600px) {
            .card {
                width: 90%;
                height: 280px;
            }

            .card.left, .card.right {
                transform: translateX(0) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="carousel-container"></div>

    <script>
        const jsonUrl = 'https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/refs/heads/main/lesson-1.json';
        const container = document.querySelector('.carousel-container');
        let vocabData = [];
        let currentIndex = 0;

        // Fetch JSON data
        async function fetchVocabData() {
            try {
                const response = await fetch(jsonUrl);
                if (!response.ok) throw new Error('Failed to load JSON data');
                vocabData = await response.json();
                initializeCarousel();
            } catch (error) {
                container.innerHTML = `<p class="error">Error loading vocabulary data: ${error.message}</p>`;
            }
        }

        // Create a card for a given index
        function createCard(index) {
            const word = vocabData[index];
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h1 class="jp-word">${word.jp}</h1>
                <p class="pronunciation">${word.prnc}</p>
                <p class="bengali-meaning">${word.bn}</p>
                <p class="comment">${word.cmt}</p>
            `;
            return card;
        }

        // Initialize the carousel with three cards
        function initializeCarousel() {
            if (vocabData.length === 0) return;
            container.innerHTML = '';
            const prevIndex = (currentIndex - 1 + vocabData.length) % vocabData.length;
            const nextIndex = (currentIndex + 1) % vocabData.length;

            const leftCard = createCard(prevIndex);
            const centerCard = createCard(currentIndex);
            const rightCard = createCard(nextIndex);

            leftCard.classList.add('left');
            centerCard.classList.add('center');
            rightCard.classList.add('right');

            container.appendChild(leftCard);
            container.appendChild(centerCard);
            container.appendChild(rightCard);

            // Start cycling
            setInterval(updateCarousel, 5000);
        }

        // Update the carousel
        function updateCarousel() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => card.classList.remove('left', 'center', 'right'));

            // Move current center to left
            cards[1].classList.add('left');
            // Move right to center
            cards[2].classList.add('center');
            // Remove left card
            cards[0].remove();

            // Add new right card
            currentIndex = (currentIndex + 1) % vocabData.length;
            const nextIndex = (currentIndex + 1) % vocabData.length;
            const newRightCard = createCard(nextIndex);
            newRightCard.classList.add('right');
            container.appendChild(newRightCard);
        }

        // Start fetching data
        fetchVocabData();
    </script>
</body>
</html>
