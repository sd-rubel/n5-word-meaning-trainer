<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Japanese Vocabulary – Premium Carousel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    /* ============== RESET ============== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root{
      --card-w: clamp(380px, 42vw, 560px);
      --card-h: clamp(320px, 55vh, 520px);
      --radius: 28px;
      --blur: 20px;
      --shadow: 0 18px 48px rgba(0,0,0,.45);
      --accent: #ffd54f;
      --accent-soft: #ffe082;
      --text-light: #e8f1ff;
      --text-bn: #9be7a1;
      --glass: rgba(255,255,255,.10);
      --glass-border: rgba(255,255,255,.28);
      --fx: cubic-bezier(.4,0,.2,1);
      --anim-dur: 900ms;
    }

    @media (prefers-reduced-motion: reduce) {
      :root{ --anim-dur: 120ms; }
    }

    /* ============== STAGE ============== */
    body{
      min-height: 100svh;
      display: grid;
      place-items: center;
      font-family: 'Noto Sans', system-ui, -apple-system, Segoe UI, Roboto, "Hind Siliguri", sans-serif;
      color: white;
      background:
        url('https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/background-img.jpg')
        no-repeat center/cover;
      position: relative;
      overflow: hidden;
    }

    /* Dark veil */
    body::before{
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(120deg, rgba(4,8,20,.70), rgba(4,8,20,.50));
      z-index: 0;
    }

    /* UI Gradient Overlay (animated, soft) */
    body::after{
      content:'';
      position: absolute; inset: -20%;
      background:
        radial-gradient(60rem 40rem at 12% 18%, rgba(255,193,7,.28), transparent 55%),
        radial-gradient(48rem 48rem at 88% 78%, rgba(41,182,246,.24), transparent 60%),
        radial-gradient(42rem 30rem at 60% 30%, rgba(129,199,132,.20), transparent 60%),
        conic-gradient(from 210deg at 50% 50%, rgba(255,255,255,.05), transparent 30%, rgba(255,255,255,.06), transparent 70%, rgba(255,255,255,.05));
      filter: blur(36px);
      mix-blend-mode: screen;
      animation: floaty 12s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }
    @keyframes floaty {
      0%   { transform: translateY(0) translateX(0) scale(1); opacity: .95; }
      100% { transform: translateY(-2%) translateX(1%) scale(1.03); opacity: 1; }
    }

    /* ============== WRAPPER ============== */
    .app-frame{
      position: relative;
      width: min(96vw, 1480px);
      height: min(78vh, 680px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
      z-index: 1;
    }

    .app-header{
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 8px 14px;
      color: #f5f7ff;
      text-shadow: 0 2px 12px rgba(0,0,0,.35);
      user-select: none;
    }
    .title{
      font-weight: 700;
      letter-spacing: .3px;
      font-size: clamp(1.05rem, 1.6vw, 1.35rem);
      opacity:.95;
    }

    /* ============== CAROUSEL ============== */
    .carousel{
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      perspective: 1200px;
      overflow: visible;
    }

    .card{
      position: absolute;
      width: var(--card-w);
      height: var(--card-h);
      padding: clamp(18px, 2.8vw, 32px);
      border-radius: var(--radius);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--blur));
      box-shadow: var(--shadow);
      transform-style: preserve-3d;
      transition:
        transform var(--anim-dur) var(--fx),
        opacity var(--anim-dur) var(--fx),
        box-shadow var(--anim-dur) var(--fx);
      opacity: 0;
    }

    .card.left{
      transform: translateX(calc(-1 * (var(--card-w) + 120px))) rotateY(16deg) scale(.78);
      opacity: .7; z-index: 1;
    }
    .card.center{
      transform: translateX(0) rotateY(0) scale(1);
      opacity: 1; z-index: 3;
      box-shadow: 0 22px 60px rgba(0,0,0,.52);
    }
    .card.right{
      transform: translateX(calc(var(--card-w) + 120px)) rotateY(-16deg) scale(.78);
      opacity: .7; z-index: 1;
    }

    /* Enter/Exit keyframes (horizontal slide with slight scale) */
    @keyframes slideInFromRight {
      0%   { transform: translateX(calc(var(--card-w) + 220px)) rotateY(-12deg) scale(.7); opacity: 0; }
      65%  { transform: translateX(-22px) rotateY(-2deg) scale(1.04); opacity: .96; }
      100% { transform: translateX(0) rotateY(0) scale(1); opacity: 1; }
    }
    @keyframes slideOutToLeft {
      0%   { transform: translateX(0) rotateY(0) scale(1); opacity: 1; }
      100% { transform: translateX(calc(-1 * (var(--card-w) + 220px))) rotateY(10deg) scale(.68); opacity: 0; }
    }
    .enter{ animation: slideInFromRight var(--anim-dur) var(--fx) forwards; }
    .exit { animation: slideOutToLeft   var(--anim-dur) var(--fx) forwards; }

    /* For broken pronunciation animation */
    @keyframes scaleUp {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .jp-word span.active {
      display: inline-block;
      animation: scaleUp 0.6s ease-in-out forwards;
    }

    /* ============== CONTENT ============== */
    .card-content{
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto auto 1fr;
      align-items: center;
      justify-items: center;
      gap: clamp(6px, 1.2vw, 12px);
      text-align: center;
    }

    .jp-word{
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: .3px;
      color: var(--accent);
      text-shadow: 0 4px 14px rgba(0,0,0,.38);
      font-size: clamp(2.1rem, 4.6vw, 3.8rem);
      white-space: nowrap;
      max-width: 100%;
    }

    .jp-word span {
      transition: transform 0.3s ease-in-out;
    }

    .pronunciation{
      font-style: italic;
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      color: #cfe8ff;
      opacity: .95;
    }

    .bengali-meaning{
      font-family: "Hind Siliguri", sans-serif;
      color: var(--text-bn);
      font-weight: 700;
      font-size: clamp(1.35rem, 2.8vw, 2rem);
      text-shadow: 0 2px 8px rgba(0,0,0,.28);
    }

    .comment{
      font-family: "Hind Siliguri", sans-serif;
      color: var(--text-light);
      opacity: .94;
      font-size: clamp(.95rem, 1.8vw, 1.12rem);
      line-height: 1.7;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      max-width: 92%;
    }

    /* Footer (optional info) */
    .app-footer{
      display: flex;
      justify-content: center;
      gap: 10px;
      opacity: .85;
      font-size: .92rem;
      user-select: none;
      text-shadow: 0 2px 10px rgba(0,0,0,.35);
    }

    /* Responsive tweaks */
    @media (max-width: 1100px){
      .card.left{ transform: translateX(calc(-1 * (var(--card-w) + 80px))) rotateY(14deg) scale(.76); }
      .card.right{ transform: translateX(calc(var(--card-w) + 80px)) rotateY(-14deg) scale(.76); }
    }
    @media (max-width: 720px){
      :root{ --card-w: min(94vw, 560px); --card-h: min(70vh, 460px); }
      .card.left, .card.right{ opacity: 0; transform: translateX(0) scale(0.6) rotateY(0); pointer-events: none; }
      .carousel{ perspective: 900px; }
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <header class="app-header">
      <div class="title">Japanese Vocabulary • Premium Carousel</div>
    </header>

    <main class="carousel" id="carousel"></main>

    <footer class="app-footer">
      <span>Auto-slide: 5s</span>
      <span>•</span>
      <span>Smooth 3D Animations</span>
    </footer>
  </div>

  <script>
    /* ================== DATA & SETUP ================== */
    const JSON_URL = 'https://raw.githubusercontent.com/sd-rubel/n5-word-meaning-trainer/main/lesson-1.json';
    const root = document.getElementById('carousel');

    let vocab = [];
    let current = 0;
    let timer = null;
    let isAnimating = false;

    // Elements for left, center, right
    let cards = [];

    // Use Web Speech API for pronunciation
    const synth = window.speechSynthesis;
    const voice = 'ja-JP';

    async function loadData(retries = 3){
      try{
        const res = await fetch(JSON_URL, {cache: 'no-store'});
        if(!res.ok) throw new Error('Failed to load JSON');
        const data = await res.json();
        if(!Array.isArray(data) || !data.length) throw new Error('No vocabulary found');
        vocab = data;
        initCarousel();
      }catch(e){
        if(retries>0){
          await new Promise(r=>setTimeout(r,1500));
          return loadData(retries-1);
        }
        root.innerHTML = `<div style="padding:20px;border-radius:14px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.25);">
          <div style="font-family:'Hind Siliguri',sans-serif;font-size:1.1rem;color:#ff8a80;">ত্রুটি:</div>
          <div style="margin-top:6px;color:#fff;">${e.message}</div>
        </div>`;
      }
    }

    /* ================== SPEECH & ANIMATION ================== */
    function speak(text, rate = 1.0, onEnd = null) {
      if (!synth || !text) return;
      
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ja-JP';
      utter.rate = rate;
      utter.onend = onEnd;

      const availableVoices = synth.getVoices();
      const japaneseVoice = availableVoices.find(v => v.lang === 'ja-JP');
      if (japaneseVoice) {
        utter.voice = japaneseVoice;
      }
      
      synth.speak(utter);
    }
    
    // Break down and pronounce each character with animation
    async function speakAndAnimate(text) {
      if (!text) return;

      const words = text.split('');
      const wordEl = cards[1].querySelector('.jp-word');
      wordEl.innerHTML = words.map(w => `<span>${w}</span>`).join('');
      
      const spans = wordEl.querySelectorAll('span');

      for (let i = 0; i < words.length; i++) {
        spans[i].classList.add('active');
        speak(words[i], 1.2);
        
        await new Promise(resolve => {
          setTimeout(() => {
            spans[i].classList.remove('active');
            resolve();
          }, 600);
        });
        
        await new Promise(resolve => setTimeout(resolve, 150));
      }
    }

    /* ================== CAROUSEL LOGIC ================== */
    function makeCard(){
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <div class="card-content">
          <div class="spacer"></div>
          <h1 class="jp-word"></h1>
          <p class="pronunciation"></p>
          <p class="bengali-meaning"></p>
          <p class="comment"></p>
        </div>
      `;
      return el;
    }

    function fillCard(card, idx){
      const w = vocab[idx];
      const jp   = w.jp ?? w.japanese ?? '';
      const prnc = w.prnc ?? w.pronunciation ?? '';
      const bn   = w.bn ?? w.meaning ?? '';
      const cmt  = w.cmt ?? w.comment ?? '';

      card.querySelector('.jp-word').textContent = jp;
      card.querySelector('.pronunciation').textContent = prnc;
      card.querySelector('.bengali-meaning').textContent = bn;
      card.querySelector('.comment').textContent = cmt;

      fitHeading(card.querySelector('.jp-word'), card);
    }

    function fitHeading(headingEl, card){
      headingEl.style.fontSize = '';
      const maxPx = Math.min(card.clientWidth * 0.16 + 24, 64);
      const minPx = 24;
      let size = maxPx;
      headingEl.style.fontSize = size + 'px';

      const pad = 24;
      const maxWidth = card.clientWidth - pad * 2;
      let safety = 40;
      while(headingEl.scrollWidth > maxWidth && size > minPx && safety--){
        size -= 2;
        headingEl.style.fontSize = size + 'px';
      }
    }

    function applyRoles(){
      cards.forEach(c => c.className = 'card');
      cards[0].classList.add('left');
      cards[1].classList.add('center');
      cards[2].classList.add('right');
    }

    function nextIndex(i=1){ return (current + i) % vocab.length; }
    function prevIndex(i=1){ return (current - i + vocab.length) % vocab.length; }

    async function processCurrentCard() {
      if(isAnimating) return;
      isAnimating = true;
      stopAuto();

      const jpWord = vocab[current].jp ?? vocab[current].japanese;
      
      // 1. Speak the full word
      await new Promise(resolve => speak(jpWord, 1.0, () => resolve()));
      await new Promise(resolve => setTimeout(resolve, 1500)); // 1.5s pause

      // 2. Speak and animate character by character
      await speakAndAnimate(jpWord);
      
      isAnimating = false;
      startAuto();
    }

    async function slideNext(){
      if(isAnimating || vocab.length < 3) return;
      isAnimating = true;
      stopAuto(); // Stop timer to prevent multiple slides

      const newCard = makeCard();
      const nextNextIdx = nextIndex(2);
      fillCard(newCard, nextNextIdx);
      root.append(newCard);

      cards[0].classList.add('exit');
      cards[1].classList.add('left');
      cards[2].classList.add('center');
      newCard.classList.add('enter');

      await Promise.all([
        waitAnimationEnd(cards[0]),
        waitAnimationEnd(newCard)
      ]);

      root.removeChild(cards[0]);
      cards.shift();
      cards.push(newCard);

      cards.forEach(card => card.classList.remove('exit', 'enter', 'left', 'center', 'right'));
      applyRoles();

      current = nextIndex(1);
      
      isAnimating = false;
      
      // Now that the new card is in place, process it
      processCurrentCard();
    }

    function waitAnimationEnd(el){
      return new Promise(resolve=>{
        const done = () => {
          el.removeEventListener('animationend', done);
          resolve();
        };
        el.addEventListener('animationend', done, { once: true });
      });
    }

    function startAuto(){
      stopAuto();
      // Start the timer to slide to the next card after a delay.
      // The delay should be long enough for the pronunciation to finish.
      // This will be triggered after `processCurrentCard` completes.
      timer = setTimeout(slideNext, 7000); 
    }

    function stopAuto(){
      if(timer) clearTimeout(timer);
      timer = null;
    }

    // Initial setup
    function initCarousel(){
      root.innerHTML = '';
      cards = [makeCard(), makeCard(), makeCard()];

      cards.forEach(card => root.append(card));

      fillCard(cards[0], prevIndex(1));
      fillCard(cards[1], current);
      fillCard(cards[2], nextIndex(1));

      applyRoles();
      
      // Process the first card immediately
      processCurrentCard();

      window.addEventListener('resize', () => {
        cards.forEach(card => {
          const h = card.querySelector('.jp-word');
          if(h) fitHeading(h, card);
        });
      });
    }

    // Kickoff
    loadData();
  </script>
</body>
</html>
